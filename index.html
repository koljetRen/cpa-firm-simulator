<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: ledger-book app — green-ink header band, stacked panels like ledger pages, bottom tab bar on phones, side rail on wide screens */
:root{

  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1715; --sheet:#17221f; --ink:#e3ece8; --muted:#94a6a0; --rule:#2a3a35;
  --band:#0b2a24; --band-ink:#d9ebe4; --accent:#3cc497; --accent-ink:#06231b; --accent-soft:#163a30;
  --pos:#4fd1a3; --neg:#ff8a80; --warn:#f0b35a; --warn-soft:#3a2c14; --neg-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1715; --sheet:#17221f; --ink:#e3ece8; --muted:#94a6a0; --rule:#2a3a35;
  --band:#0b2a24; --band-ink:#d9ebe4; --accent:#3cc497; --accent-ink:#06231b; --accent-soft:#163a30;
  --pos:#4fd1a3; --neg:#ff8a80; --warn:#f0b35a; --warn-soft:#3a2c14; --neg-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}

body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
h2{font-size:1.3rem}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:.88rem} .neg{color:var(--neg)} .pos{color:var(--pos)}
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--band);color:var(--band-ink)}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:880px;margin:0 auto}
.brand{display:flex;flex-direction:column;min-width:0}

.chartwrap svg{width:100%;height:auto;display:block}

.k.rev{background:var(--accent);opacity:.35}.k.pl{background:var(--ink);height:3px;vertical-align:3px}
.svcs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.svc{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}

.tablewrap{overflow-x:auto;margin:0 -16px;padding:0 16px}

.scrim{position:absolute;inset:0;background:rgba(8,20,17,.55)}

.opt{min-height:48px;text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px}

.btn:disabled{opacity:.45;cursor:not-allowed}

.card-f{flex-wrap:wrap}
.ppl2,.tms{list-style:none;margin:0;padding:0}
.pp{border-bottom:1px solid var(--rule)}

.pill.bad{background:var(--neg-soft);color:var(--neg)}

table.rk tbody th{position:static}
table.rk{width:100%}table.rk thead th:nth-child(2),table.rk thead th:last-child{text-align:left}

  const dirLog = (s, msg) => { s.meta.dirLog = s.meta.dirLog || []; s.meta.dirLog.push(msg); s.history.directors.push({ t: refTurn(s), msg }); };

  const fmt$ = (v) => '$' + Math.round(v).toLocaleString('en-US');

  /* ---------- Useful roles (serve an offered group) ---------- */
  C.offeredGroups = function (s) {

  };
  C.roleUseful = function (s, name) {
    const i = RI[name]; if (!i) return false;

    const g = C.offeredGroups(s);
    return i.groups.some(x => g.has(x));
  };

  /* ---------- Teams ---------- */
  C.teams = function (s, t = refTurn(s)) {
    const ros = roster(s, t).filter(p => p.team != null && isTeamLevel(p)).sort((a, b) => a.id - b.id);
    const map = new Map();
    ros.forEach(p => {
      if (!map.has(p.team)) map.set(p.team, { id: p.team, members: [], mgr: 0, sr: 0, as: 0, in: 0, dept: null });
      const k = map.get(p.team), l = info(p).lvl;

  C.youLead = (s) => (+s.settings.youLeadAlways || C.revT12(s) < s.settings.actAsDirectorUntil) ? 2 : 0;
  C.teamPlan = function (s, t = refTurn(s)) {
    const teams = C.teams(s, t), yl = C.youLead(s);

      DEPTS.forEach(d => { byD[d].dirSeats = C.roleUseful(s, roleFor(d, 1)) ? Math.max(0, Math.ceil((byD[d].teams + 1 - alloc[d] - left) / 2) - byD[d].dirs) : 0; });

  // Seats for one role at a level in a department: team room + new-team room × per-team size
  function teamSpots(s, d, lvl, plan) {
    const per = { 0: 2, 1: 3, 2: 3, 3: 1 }[lvl];
    const ks = plan.teams.filter(k => k.dept === d || !k.dept);
    const room = ks.reduce((a, k) => a + (lvl === 0 ? k.inRoom : lvl === 1 ? (k.dept ? k.asRoom : 0) : lvl === 2 ? (k.dept ? k.srRoom : 0) : (k.dept ? k.mgrRoom : 0)), 0);

  C.openSpots = function (s, name, t = refTurn(s)) {
    const i = RI[name]; if (!i || i.lvl === 9) return 0;
    const ros = roster(s, t), cur = ros.filter(p => p.role === name).length, plan = C.teamPlan(s, t);
    if (name === 'Admin Assistant') return Math.max(0, Math.max(2 * Math.max(1, s.offices.length), Math.ceil((s.prev.AA || 0) / YR)) - cur);
    if (name === 'Admin Manager') return s.offices.length ? Math.max(0, Math.ceil(s.offices.length / 4) - cur) : 0;
    if (name === 'Bookkeeper') { const h = s.services.filter(x => x.slot === 1 || x.slot === 4).reduce((a, x) => a + x.clients * x.hpc, 0); return Math.max(0, Math.ceil(h / YR) + 1 - cur); }

    return Math.max(0, teamSpots(s, i.dept, i.lvl, plan));
  };

  // Place one person on a team (v1 rules). Returns team id or null.
  function placePerson(s, p, t) {
    if (!isTeamLevel(p)) { p.team = null; return null; }
    const l = info(p).lvl, d = info(p).dept;
    const plan = C.teamPlan(s, t);
    const fits = (k) => (k.dept === d || !k.dept) && (l === 3 ? k.dept === d && k.mgrRoom > 0 : l === 2 ? k.dept === d && k.srRoom > 0 : l === 1 ? k.asRoom > 0 && (k.dept === d || !k.dept) : k.inRoom > 0);

  function placeUnassigned(s, t) {

  }

  /* ---------- Candidates ---------- */
  const ramp = { CPA: [0, 0, .7, .9, 1], EA: [.4, .7, 1], CPB: [.5, .8, 1], CFP: [.1, .3, .6, 1] };

  function genCerts(s, name, yrs, acquired) {
    const i = RI[name], out = [];
    ['CPA', 'EA', 'CFP', 'CPB'].forEach(c => { if ((i.odds[c] || 0) > 0 && R.next(s) < i.odds[c] * rampAt(c, yrs)) out.push(c); });

  }
  function genAge(s, name, yrs, acquired) {
    const i = RI[name];

    if (i.dept === 'Admin' || name === 'Bookkeeper' || i.dept === 'HR') { let a = randInt(s, 20, 32); if (R.next(s) < 0.55) a += randInt(s, 3, 28); return clamp(Math.max(a, 18 + yrs), 19, 64); }
    let a = 22 + yrs + randInt(s, 0, 3);

    if (name === 'Admin Manager' || (RI[name] && RI[name].dept === 'HR')) return R.next(s) < .85 ? "Bachelor's" : "Master's";

  function localStates(s) {

  C.genCandidate = function (s, name, opts = {}) {

  /* ---------- Hiring ---------- */
  C.hire = function (s, c, opts = {}) {
    const t0 = opts.startTurn || startTurnForHire(s), i = RI[c.role];

  C.autoHire = function (s, roleName, n, why) {

  // Roles shown in a hire pop-up. mode: 'any' (Hire Someone) or a fixed role list.

  };
  // Hiring Desk load (v2): measured the same way as the capacity gauge. Demand is each group's
  // committed yearly hours plus its share of the admin work left to accountants; capacity uses
  // real output (role output, CPA/EA bonus, crowding). Summed over groups it equals capacity used.
  C.loadTable = function (s, t = refTurn(s)) {
    const groups = ['CAS', 'Tax', 'Audit', 'Valuation', 'Forensic', 'Financial Planning', 'Advisory'], og = C.offeredGroups(s), yrF = 12 + 6 * s.settings.busyOvertime;
    const dem = {}; groups.forEach(g => dem[g] = s.services.filter(x => x.offered && x.group === g).reduce((a, x) => a + x.clients * x.hpc, 0));
    const totDem = groups.reduce((a, g) => a + dem[g], 0);
    const adminLeft = s.prev.AB || 0;
    const cap = {}; groups.forEach(g => cap[g] = 0);
    let spread = 0, admH = 0, bkH = 0;
    C.activePeople(s, t).forEach(p => {
      const i = info(p), r = C.ROLES[p.role] || ['', 0, 0, 1, 160, 'Client'], hc = p.hc || 1, hrs = (p.hours || r[4]) * hc;
      if (r[5] === 'None') return;
      if (r[5] === 'Admin') { admH += hrs * r[3] * yrF; return; }
      const h = hrs * C.outputOf(s, p) * C.crowd(s, p, t) * yrF;
      if (r[5] === 'Bookkeeper') { bkH += h; return; }

  };
  const loadLines = (s) => C.loadTable(s).map(r => ({ k: r.group + ' load', v: (r.load >= 9.99 ? 'no staff' : Math.round(r.load * 100) + '%') + (r.load >= 0.8 ? ' · needs help' : '') }));

  // Card builders for the hire flow
  C.startHireFlow = function (s, roles, title, front) {
    roles = roles || C.hireableRoles(s, 'any');

    if (!roles.length) { push(s, { type: 'info', kind: 'choice', title: title || 'Hire someone', data: { lines: ['There are no open spots right now. Associates fill team seats; new teams need a director (you lead 2 until revenue reaches $2M). Interns are hired January to April.'] } }); return; }
    push(s, { type: 'hireRole', kind: 'choice', title: title || 'Hire someone', data: { lines: loadLines(s), options: roles.map(n => ({ value: n, label: n, sub: 'Base ' + fmt$(RI[n].base) + ' · ' + C.openSpots(s, n) + ' open' })), buttons: [{ value: 'cancel', label: 'Cancel' }] } });
  };

  }

  }

  /* ---------- Promotions ---------- */
  C.promoteTo = (p) => info(p).next;
  C.promote = function (s, p, t) {
    const nx = info(p).next; if (!nx) return false;

  // Seats for a promotion round into level `to` in department d

    const plan = C.teamPlan(s, t);

    const ks = plan.teams.filter(k => k.dept === d);
    if (toLvl === 3) return ks.filter(k => k.mgrRoom > 0).length;

  }

    return C.activePeople(s, t).filter(p => info(p).dept === d && info(p).lvl === fromLvl && p.endTurn == null && info(p).next)
      .sort((a, b) => (b.rating || 3) - (a.rating || 3) || (b.certs || []).length - (a.certs || []).length || a.startTurn - b.startTurn); // v2: certifications help promotions
  }
  // Push one card per department with open seats. Returns count of cards.
  C.promotionRound = function (s, fromLvl, opts = {}) {
    const t = refTurn(s); let n = 0;
    const toLvl = fromLvl === 8 ? 7 : fromLvl + 1;
    if (fromLvl === 8) {
      const seats = C.openSpots(s, 'Admin Manager', t);
      const cands = C.activePeople(s, t).filter(p => p.role === 'Admin Assistant' && p.endTurn == null);

    }
    DEPTS.forEach(d => {
      if (!C.roleUseful(s, roleFor(d, toLvl === 4 ? 1 : toLvl))) return;

      else if (toLvl === 4 && cands.length && seats <= 0 && opts.tellNoSeat) { C.pushCard(s, { type: 'info', kind: 'choice', title: 'No open director seat', data: { lines: [d + ' managers could move up, but every ' + d + ' director seat is filled.'] } }); }

  };
  function promoCard(s, d, fromLvl, seats, cands, t, office) {
    const nextName = fromLvl === 8 ? 'Admin Manager' : roleFor(d, fromLvl + 1);
    const opts = cands.slice(0, 8).map(p => {
      const needCPA = C.promoNeeds(p, RI[nextName]);
      const after = Math.max(C.marketPay(s, nextName, p.years), r500(p.salary * (1 + s.settings.promoRaise)));

  // Each January, drop people who left before this month (they left during the year just ended).

  /* ---------- Month stages ---------- */
  function offerIntern(s, p, t) {

  }
  // Phase 10: after the hand-off, directors only add people where the work is (they used to offer every

  function deptNeed(s, t, d, target) {

  function mayInterns(s, t) {

    interns.forEach(p => { const sc = clamp(Math.round(s.settings.internScore + R.normal(s)), 1, 5); p.rating = sc; p.ratings = (p.ratings || []).concat('Intern ' + y + ' (' + sc + ')'); });
    const need = {};
    if (handOff(s)) interns.slice().sort((a, b) => b.rating - a.rating).forEach(p => {
      const d = info(p).dept, sc = p.rating;

      else { p.team = null; dirLog(s, 'Let ' + p.name + ' (intern, ' + sc + ') finish without an offer' + (sc >= 3 ? ' (no open work in ' + d + ')' : '') + '.'); }
    });
    if (!handOff(s)) interns.forEach(p => {
      const sc = p.rating;
      C.pushCard(s, { type: 'internOffer', kind: 'choice', title: 'End of the internship', data: { id: p.id, t, lines: [p.name + ' · ' + p.role + ' · scored ' + sc + ' of 5', p.school ? p.school : '', 'Offer a full-time job as ' + roleFor(info(p).dept, 1) + ' starting ' + mlab(s, C.turnOf(s, y, 8)) + ' at ' + fmt$(C.marketPay(s, roleFor(info(p).dept, 1), 0)) + '?'].filter(Boolean), buttons: [{ value: 'yes', label: 'Offer the job', primary: true }, { value: 'no', label: 'No offer' }] } });
    });
  }
  function mayReviews(s, t) {
    const { y } = C.monthOf(s, t), st = s.settings;
    const busy = s.history.log.filter(r => r.y === y && r.m <= 4), bw = busy.length ? busy.reduce((a, r) => a + r.workload, 0) / busy.length : 0;
    const ppl = C.activePeople(s, t).filter(p => p.startTurn < t && info(p).lvl !== 0 && info(p).lvl !== 9 && (p.hc || 1) === 1);
    if (!ppl.length) return;
    const cnt = [0, 0, 0, 0, 0, 0];
    ppl.forEach(p => {

      if (p.years >= 3) r += 0.15; if (p.certs.length) r += 0.10; if (bw > 1.1) r -= 0.20;
      p.rating = clamp(Math.round(r), 1, 5); p.ratings = (p.ratings || []).concat(y + ' (' + p.rating + ')'); cnt[p.rating]++;
    });
    const avg = ppl.reduce((a, p) => a + p.rating, 0) / ppl.length;
    const line = ppl.length + ' rated, average ' + avg.toFixed(2) + ': ' + [5, 4, 3, 2, 1].map(k => cnt[k] + '× ' + k).join(', ');
    if (handOff(s)) dirLog(s, 'May reviews: ' + line + '.');
    else C.pushCard(s, { type: 'info', kind: 'choice', title: 'May performance reviews', data: { lines: [line, bw > 1.1 ? 'Busy-season workload averaged ' + Math.round(bw * 100) + '%, which pulled ratings down.' : ''].filter(Boolean) } });
    const low = ppl.filter(p => p.rating <= st.askRatedAtOrBelow && (p.endTurn == null || p.endTurn > t + 1));
    low.forEach((p, k) => {
      if (handOff(s) && info(p).lvl <= 2) { p.endTurn = t + 1; p.source += '; let go ' + mlab(s, t); dirLog(s, 'Let go ' + p.name + ' (' + p.role + ', rated 1).'); return; }
      C.pushCard(s, { type: 'letGo', kind: 'choice', title: 'May review (' + (k + 1) + ' of ' + low.length + ')', data: { id: p.id, t, lines: [p.name + ' · ' + p.role + ' · rated ' + p.rating, 'Ratings: ' + (p.ratings || []).join(', '), 'Let them go at the end of ' + mlab(s, t) + '?'], buttons: [{ value: 'yes', label: 'Let go' }, { value: 'no', label: 'Keep', primary: true }] } });
    });
  }
  function resignations(s, t) {
    const st = s.settings, m = C.monthOf(s, t).m;

    const left = [];

    C.pushCard(s, { type: 'departFill', kind: 'choice', title: 'People leaving', data: { roles: ask.map(p => p.role), lines: ask.slice(0, 12).map(p => p.name + ' · ' + p.role + ' · ' + (/retir/.test(p.source) ? 'retiring' : /let go/.test(p.source) ? 'let go' : 'resigned')), buttons: [{ value: 'auto', label: 'Fill now (best picks)', primary: true }, { value: 'pick', label: 'Fill now, I pick' }, { value: 'wait', label: 'Wait for the calendar' }] } });
  }
  function promoCalendar(s, t) {

    if (m === 5) C.promotionRound(s, 3, { tellNoSeat: true });
    if (m === 6) C.promotionRound(s, 2);
    if (m === 7) { if (!handOff(s)) C.promotionRound(s, 1); C.promotionRound(s, 8); }
  }
  function autoSeniors(s, t) {
    DEPTS.forEach(d => {
      let seats = promoSeats(s, d, 2, t); if (seats <= 0) return;
      const cands = promoCandidates(s, d, 1, t).sort((a, b) => b.rating - a.rating || a.startTurn - b.startTurn);
      cands.forEach(p => { if (seats > 0 && (p.rating >= 4 || (p.rating === 3 && yearsAtFirm(s, p, t) >= 2)) && C.promote(s, p, t)) { seats--; dirLog(s, 'Promoted ' + p.name + ' to ' + p.role + '.'); } });
      if (seats > 0) dirLog(s, seats + ' ' + d + ' senior seat(s) left open.');
    });
  }
  function augustHiring(s, t) {
    const roles = DEPTS.map(d => roleFor(d, 1)).filter(r => C.roleUseful(s, r) && C.openSpots(s, r, t) > 0);
    if (!roles.length) return;
    if (handOff(s)) {
      const lt = C.loadTable(s, t);
      roles.forEach(r => { const d = RI[r].dept, row = lt.find(x => x.group === d); if (!row) return; const n = Math.min(C.openSpots(s, r, t), Math.max(0, Math.ceil((row.demand / 0.65 - row.capacity) / YR))); if (n > 0) { const h = C.autoHire(s, r, n); dirLog(s, 'Hired ' + h.length + ' ' + r + (h.length > 1 ? 's' : '') + '.'); } });
      return;
    }

  /* ---------- Year end (people) ---------- */

        if (!i.certs.includes(c) || p.certs.includes(c) || (c === 'CPA' && p.years < 2)) return;
        let ch = st['cert' + c] * (p.years > 8 ? 0.3 : p.years > 5 ? 0.6 : 1) * (r >= 4 ? 1.2 : r <= 2 ? 0.8 : 1) * (bw > 1 ? 0.85 : 1) * (c === 'CFP' && p.certs.includes('CPA') ? 0.5 : 1);
        if (R.next(s) < ch) { p.certs.push(c); certs.push(p.name + ' (' + c + ')'); }
      });
      const old = p.salary; p.salary = r100(p.salary * (1 + st['raise' + r])); raiseCost += p.salary - old;
    });
    const retired = [];
    C.activePeople(s, t).filter(p => p.id !== 1 && info(p).lvl !== 9 && (p.endTurn == null || p.endTurn > t + 1)).forEach(p => { // v1: active now and next month
      const a = p.age; let ch = 0;
      if (a < st.retireEarliest) ch = 0; else if (a >= st.retireBy) ch = 1; else if (a < 65) ch = 0.03 + (a - st.retireEarliest) * (st.retireAt65 - 0.03) / Math.max(1, 65 - st.retireEarliest) * 0.8; else ch = st.retireAt65 + (a - 65) * (1 - st.retireAt65) / Math.max(1, st.retireBy - 65);
      if (a >= st.retireEarliest && R.next(s) < ch) { p.endTurn = t + 1; p.source += '; retiring ' + mlab(s, t + 1); retired.push(p.name + ' (' + p.role + ', ' + a + ')'); }
    });
    if (rated.length) out.push('Average rating ' + (rated.reduce((a, p) => a + (p.rating || 3), 0) / rated.length).toFixed(2) + '. Raises add ' + fmt$(raiseCost) + ' a year to payroll.');
    out.push('Resignations this year: ' + (s.meta.yearQuits || 0) + '.'); s.meta.yearQuits = 0;
    if (certs.length) out.push('Certifications earned: ' + certs.slice(0, 12).join(', ') + (certs.length > 12 ? ' and ' + (certs.length - 12) + ' more' : '') + '.');
    if (retired.length) out.push('Retiring in January: ' + retired.slice(0, 10).join(', ') + (retired.length > 10 ? ' and ' + (retired.length - 10) + ' more' : '') + '.');
    return out;
  }
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* ===== CPA Firm Simulator v2 — SCREENS =====
   Reads the game object, calls engine actions, saves after every change.
   Later phases add a tab by pushing to UI.tabs and card renderers to UI.cardViews. */
(function () {
  const C = window.CPA;
  const KEY = 'cpaFirmSim.v2.save';
  const $ = (q, el = document) => el.querySelector(q);
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const money = (v, compact) => {
    const n = Math.round(v || 0), neg = n < 0, a = Math.abs(n);
    let t;
    if (compact && a >= 1e9) t = (a / 1e9).toFixed(2) + 'B';
    else if (compact && a >= 1e6) t = (a / 1e6).toFixed(2) + 'M';
    else if (compact && a >= 1e4) t = (a / 1e3).toFixed(1) + 'K';
    else t = a.toLocaleString('en-US');
    return (neg ? '−$' : '$') + t;
  };
  const pct = (v, d = 0) => (v * 100).toFixed(d) + '%';
  const signed = (n) => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n);

  let S = null, tab = 'home', busy = false, confirmNew = false, launchPick = [], notice = '';

  /* ---------- storage ---------- */
  // Saves go to this device right away and to your claude.ai account a moment later (survives closing
  // a home-screen app, works across devices). A save is split into parts under the 256 KiB record limit.
  let cloud = null, cloudTimer = null, cloudBusy = false, cloudState = 'connecting';
  const PART = 100000;
  function save() {
    if (S) S.meta.savedAt = Date.now();
    try { localStorage.setItem(KEY, C.serialize(S)); } catch (e) { /* storage blocked: the account copy still works */ }
    scheduleCloud();
  }
  function scheduleCloud() { if (!cloud) return; clearTimeout(cloudTimer); cloudTimer = setTimeout(pushCloud, 1500); }
  async function pushCloud() {
    if (!cloud || !S) return;
    if (cloudBusy) { scheduleCloud(); return; }
    cloudBusy = true;
    try {
      const txt = C.serialize(S), n = Math.ceil(txt.length / PART);
      for (let i = 0; i < n; i++) await cloud.doc('save' + i).set({ chunk: txt.slice(i * PART, (i + 1) * PART) });
      await cloud.doc('saveMeta').set({ parts: n, savedAt: S.meta.savedAt || Date.now(), month: C.played(S), firm: S.meta.firmName });
      cloudState = 'saved';
    } catch (e) { cloudState = 'error'; }
    cloudBusy = false;
    const el = document.getElementById('cloudstate'); if (el) el.textContent = cloudLabel();
  }
  function cloudLabel() { return cloudState === 'saved' ? 'Saved to your claude.ai account.' : cloudState === 'error' ? 'Couldn\'t reach your account just now; saved on this device. It will try again on the next save.' : cloudState === 'off' ? 'Account saving isn\'t available here (for example when signed out), so the game saves on this device only.' : 'Connecting to your account…'; }
  async function initCloud() {
    try {
      if (!window.claude || !window.claude.use) { cloudState = 'off'; return; }
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const uid = user && await user.id();
      if (!db || !uid) { cloudState = 'off'; return; }
      cloud = db.collection('data/users/' + uid);
      const meta = await cloud.doc('saveMeta').get();
      const m = meta.exists ? meta.data() : null;
      if (m && m.parts && ((+m.savedAt || 0) > ((S && S.meta.savedAt) || 0) || (C.played(S) === 0 && (+m.month || 0) > 0))) {
        const parts = await Promise.all(Array.from({ length: m.parts }, (_, i) => cloud.doc('save' + i).get()));
        if (parts.every(p => p.exists)) {
          const next = C.deserialize(parts.map(p => p.data().chunk).join(''));
          S = next; try { localStorage.setItem(KEY, C.serialize(S)); } catch (e) { }
          C.advance(S); notice = 'Loaded your saved game from your claude.ai account.'; render();
        }
      } else scheduleCloud();
      cloudState = 'saved';
    } catch (e) { cloudState = 'error'; }
    const el = document.getElementById('cloudstate'); if (el) el.textContent = cloudLabel();
  }
  function load() { try { const t = localStorage.getItem(KEY); return t ? C.deserialize(t) : null; } catch (e) { return null; } }
  try { const t = localStorage.getItem('cpaFirmSim.v2.tab'); if (t) tab = t === 'log' ? 'ranks' : t; } catch (e) { } // the Turn Log tab became the IPA 500 tab

  /* ---------- tabs ---------- */
  const UI = window.CPA_UI = { tabs: [], cardViews: {}, state: () => S };
  UI.tabs.push(
    { id: 'home', label: 'Firm', icon: 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z', render: renderHome },
    { id: 'clients', label: 'Clients', icon: 'M16 11a4 4 0 1 0-8 0M4 21a8 8 0 0 1 16 0M12 3v4', render: renderClients },
    { id: 'ranks', label: 'IPA 500', icon: 'M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4', render: () => UI.rankPanel ? UI.rankPanel() : '' },
    { id: 'more', label: 'Growth', icon: 'M4 19l5-6 4 3 7-9M15 7h5v5', render: renderMore },
    { id: 'settings', label: 'Settings', icon: 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM4 12h2M18 12h2M12 2v2M12 20v2', render: renderSettings },
  );

  /* ---------- actions ---------- */
  function play(mode) {
    if (busy) return;
    if (!C.startRun(S, mode)) { C.advance(S); render(); return; }
    C.advance(S); save(); render();
  }
  function answer(id, value) { C.answer(S, id, value); C.advance(S); save(); render(); }
  function newGame() {
    const name = ($('#ng-name') || {}).value || S && S.meta.firmName;
    const seed = ($('#ng-seed') || {}).value;
    confirmNew = false;
    const plain = () => startGame({ firmName: name, seed });
    if (UI.askTutorial) UI.askTutorial(() => startGame({ tutorial: true }), plain); else plain();
  }
  // Tutorial games start from a preset firm: the default name, a fixed seed and $500 of marketing.
  function startGame(o) {
    S = o.tutorial ? C.newGame({ firmName: 'BlueJaye Financials LLC', seed: 2026 }) : C.newGame(o);
    if (o.tutorial) { S.decisions.marketing = 500; S.meta.tutorial = 0; }
    tab = 'home'; notice = o.tutorial ? '' : 'New game ready (seed ' + S.meta.seed + ').';
    save(); render(); window.scrollTo(0, 0);
  }
  UI.startGame = startGame;
  UI.setTab = (id) => { tab = id; launchPick = []; try { localStorage.setItem('cpaFirmSim.v2.tab', tab); } catch (e) { } render(); };
  UI.tab = () => tab;
  UI.save = () => save();
  UI.render = () => render();

  /* ---------- shell ---------- */
  function render() {
    const app = $('#app');
    const t = C.nextTurn(S), playedN = C.played(S);
    const cur = playedN ? C.monthLabel(S, playedN) : 'Not started';
    const rank = C.liveRank(S);
    $('#hdr').innerHTML = `<div class="hdr-in"><div class="brand"><span class="firm">${esc(S.meta.firmName)}</span><span class="sub">${S.offices.length ? esc(C.cityBase(S.offices[0].city)) + ' HQ' : 'Remote · Rexburg'} · ${playedN ? 'Through ' + cur : 'Opens ' + C.monthLabel(S, 1)}</span></div><div class="rankchip" title="Live rank on the IPA 500"><span>Rank</span><b>${rank === '500+' ? '500+' : '#' + rank}</b></div></div>`;
    const T = UI.tabs.find(x => x.id === tab) || UI.tabs[0];
    app.innerHTML = (notice ? `<div class="notice" role="status">${esc(notice)}</div>` : '') + T.render();
    notice = '';
    $('#tabs').innerHTML = UI.tabs.map(x => `<button class="tab${x.id === T.id ? ' on' : ''}" data-tab="${x.id}" aria-label="${x.label}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${x.icon}"/></svg><span>${x.label}</span></button>`).join('');
    renderCard();
    bind();
    if (UI.afterRender) UI.afterRender();
  }

  /* ---------- dashboard ---------- */
  function renderHome() {
    const L = S.history.log, last = L[L.length - 1], t = C.nextTurn(S);
    const cash = C.cash(S), p12 = C.profitT12(S), r12 = C.revT12(S);
    const cap = last ? last.capacityUsed : (S.prev.P + S.prev.AB) / Math.max(1, C.activePeople(S, t).reduce((a, p) => a + 160 * C.outputOf(S, p), 0) * (12 + 6 * S.settings.busyOvertime));
    const wl = last ? last.workload : 0;
    const rank = C.liveRank(S);
    const min500 = Math.min(...S.market.firms.map(f => f.revenue));
    const gauge = (v, lbl, note) => { const c = v > 1 ? 'bad' : v > 0.85 ? 'warn' : 'ok'; return `<div class="gauge ${c}"><div class="g-top"><span class="lbl">${lbl}</span><b class="num">${pct(v)}</b></div><div class="bar"><i style="width:${Math.min(100, v * 100)}%"></i><em style="left:100%"></em></div><div class="g-note">${note}</div></div>`; };
    const d = S.decisions;
    return `
    <section class="kpis">
      <div class="kpi lead"><span class="lbl">Cash on hand</span><b class="num big ${cash < 0 ? 'neg' : ''}">${money(cash)}</b><span class="hint">${cash < 0 ? 'Out of cash: you pay ' + money(C.overdraftInterest ? C.overdraftInterest(S) : 0) + ' a month in interest (' + pct(S.settings.overdraftRate || 0) + ' a year) until it\'s paid back.' : 'Starting cash ' + money(S.settings.startingCash)}</span></div>
      <div class="kpi"><span class="lbl">Profit 12 mo</span><b class="num ${p12 < 0 ? 'neg' : ''}">${money(p12, true)}</b><span class="hint">Last mo ${last ? money(last.profit, true) : '—'}</span></div>
      <div class="kpi"><span class="lbl">Revenue 12 mo</span><b class="num">${money(r12, true)}</b><span class="hint">YTD ${money(C.revYTD(S), true)}</span></div>
      <div class="kpi"><span class="lbl">IPA 500 rank</span><b class="num">${rank === '500+' ? '500+' : '#' + rank}</b><span class="hint">#500 earns ${money(min500, true)}</span></div>
    </section>
    <section class="panel">
      <div class="gauges">
        ${gauge(cap, 'Capacity used', 'Committed yearly hours vs. what your people can do. At 100% you win no new clients.')}
        ${gauge(wl, 'Workload this month', 'Over 100% raises next month\'s client losses.')}
      </div>
      <div class="facts"><span><b class="num">${C.totalClients(S)}</b> clients</span><span><b class="num">${C.activePeople(S, t).length}</b> on staff</span><span>${S.offices.length ? '<b class="num">' + S.offices.length + '</b> office' + (S.offices.length > 1 ? 's' : '') : 'Remote'}</span></div>
    </section>
    <section class="panel decide">
      <h2>Next month · ${C.monthLabel(S, t)}</h2>
      <label class="field" for="mkt"><span>Marketing per month</span>
        <div class="row"><span class="pre">$</span><input id="mkt" type="number" inputmode="numeric" min="0" step="100" value="${d.marketing}"><span class="aside">≈ ${(d.marketing / S.settings.costPerLead).toFixed(1)} leads</span></div>
      </label>
      <div class="chips">${[0, 250, 500, 1000, 2500].map(v => `<button class="chip${+d.marketing === v ? ' on' : ''}" data-mkt="${v}">${v ? money(v) : 'None'}</button>`).join('')}</div>
      <label class="field" for="price"><span>Price vs. list fees <b class="num" id="pricev">${d.price > 0 ? '+' : ''}${pct(d.price)}</b></span>
        <input id="price" type="range" min="-50" max="50" step="1" value="${Math.round(d.price * 100)}">
        <span class="aside">${d.price > 0 ? 'Fewer new clients (−' + pct(d.price * S.settings.priceSens) + ') and more losses.' : d.price < 0 ? 'More new clients; no effect on losses.' : 'List fees.'}</span>
      </label>
      <div class="play">
        <button class="btn primary" data-act="month">Play next month</button>
        <button class="btn" data-act="year">Play year<small>through December</small></button>
      </div>
    </section>
    ${last ? `<section class="panel last">
      <h2>Last month · ${esc(last.label)}</h2>
      <div class="dice"><div><span class="lbl">Growth roll</span><b class="num">${last.growthRoll}</b><span>${esc(last.growthLabel)} · leads ×${last.leadMult}</span></div><div><span class="lbl">Event roll</span><b class="num">${last.eventRoll}</b><span>${esc(last.event)}</span></div></div>
      <div class="facts"><span>New <b class="num pos">+${last.newClients}</b></span><span>Lost <b class="num neg">${last.lostClients ? "−" + last.lostClients : 0}</b></span><span>Revenue <b class="num">${money(last.revenue)}</b></span><span>Profit <b class="num ${last.profit < 0 ? 'neg' : ''}">${money(last.profit)}</b></span></div>
    </section>` : `<section class="panel last"><h2>Your firm on day one</h2><p class="muted">You start alone and remote in Rexburg with 13 clients: 3 bookkeeping, 8 personal returns and 2 business returns. Set your marketing and price, then play your first month.</p></section>`}
    <section class="panel"><h2>Last 12 months</h2>${chart(L.slice(-12))}</section>`;
  }

  function chart(rows) {
    if (!rows.length) return '<p class="muted">Revenue and profit appear here once you play a month.</p>';
    const W = 340, H = 150, pl = 44, pb = 22, pt = 8;
    const max = Math.max(1, ...rows.map(r => r.revenue), ...rows.map(r => r.profit));
    const min = Math.min(0, ...rows.map(r => r.profit));
    const y = v => pt + (H - pt - pb) * (max - v) / (max - min);
    const bw = (W - pl - 4) / 12;
    const ticks = [min, 0, max / 2, max].filter((v, i, a) => a.indexOf(v) === i);
    let g = ticks.map(v => `<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${pl - 6}" y="${y(v) + 3}" class="ax" text-anchor="end">${money(v, true)}</text>`).join('');
    g += rows.map((r, i) => `<rect x="${pl + 2 + i * bw}" y="${y(Math.max(0, r.revenue))}" width="${bw - 4}" height="${Math.max(0, y(0) - y(r.revenue))}" class="rev"><title>${r.label}: revenue ${money(r.revenue)}</title></rect><text x="${pl + i * bw + bw / 2}" y="${H - 6}" class="ax" text-anchor="middle">${C.MONTHS[r.m - 1][0]}</text>`).join('');
    const pts = rows.map((r, i) => `${pl + i * bw + bw / 2},${y(r.profit)}`).join(' ');
    g += `<polyline points="${pts}" class="pl"/>` + rows.map((r, i) => `<circle cx="${pl + i * bw + bw / 2}" cy="${y(r.profit)}" r="${i === rows.length - 1 ? 3.5 : 2}" class="pd"><title>${r.label}: profit ${money(r.profit)}</title></circle>`).join('');
    return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenue bars and profit line for the last 12 months">${g}</svg></div><div class="legend"><span><i class="k rev"></i>Revenue</span><span><i class="k pl"></i>Profit</span></div>`;
  }

  /* ---------- clients & services ---------- */
  function renderClients() {
    const t = C.nextTurn(S), r12 = C.revT12(S), price = S.decisions.price;
    const launchable = C.launchable(S);
    const rows = S.services.map((x, i) => {
      const on = x.offered, rev = C.svcRevT12(S, i);
      let status;
      if (on) status = x.fromTurn > C.played(S) ? `<span class="pill soon">Starts ${C.monthLabel(S, x.fromTurn)}</span>` : `<span class="pill on">Offered</span>`;
      else if (launchable.includes(x)) status = launchPick.includes(x.slot) ? `<button class="chip on" data-launch="${x.slot}" aria-pressed="true">✓ Selected</button>` : `<button class="chip act" data-launch="${x.slot}" aria-pressed="false">Select to launch</button>`;
      else if (C.serviceGateText && x.launch === 'launch' && C.serviceGateText(S, x)) status = `<span class="pill lock">${esc(C.serviceGateText(S, x))}</span>`;
      else if (x.launch === 'afterAudit') status = `<span class="pill lock">After Audit &amp; Assurance</span>`;
      else status = `<span class="pill lock">Comes with a bought firm</span>`;
      return `<li class="svc${on ? '' : ' off'}"><div class="svc-h"><div class="svc-n"><b>${esc(x.name)}</b><span>${esc(x.type)} · ${esc(x.group)} · ${x.hpc} hrs/client/yr</span>${on && C.serviceGateText && C.serviceGateText(S, x) ? `<span class="warnline small">${esc(C.serviceGateText(S, x))}</span>` : ''}</div>${status}</div>
        <div class="svc-f"><span><em>Clients</em><b class="num">${x.clients}</b></span><span><em>Fee / yr</em><b class="num">${money(x.fee * (1 + price))}</b></span><span><em>Rev 12 mo</em><b class="num">${money(rev, true)}</b></span><span><em>Share</em><b class="num">${r12 > 0 ? pct(rev / r12) : '—'}</b></span></div></li>`;
    }).join('');
    launchPick = launchPick.filter(sl => launchable.some(x => x.slot === sl));
    const picks = launchPick.map(sl => S.services.find(x => x.slot === sl));
    return `<section class="panel"><h2>Clients and services</h2>
      <div class="facts"><span><b class="num">${C.totalClients(S)}</b> clients</span><span>Revenue 12 mo <b class="num">${money(r12, true)}</b></span><span>YTD <b class="num">${money(C.revYTD(S), true)}</b></span></div>
      <p class="muted small">Fees shown at your price change (${price > 0 ? '+' : ''}${pct(price)}). Project services count engagements won in the last 12 months.</p></section>
      ${launchable.length ? `<p class="muted small">Tap <b>Select to launch</b> on as many services as you like, then launch them together from the bar at the bottom.</p>` : ''}
      <ul class="svcs">${rows}</ul>
      ${picks.length ? `<div class="stickybar" role="region" aria-label="Launch selected services"><div><b>Launch ${picks.length} service${picks.length > 1 ? 's' : ''} from ${C.monthLabel(S, t)}</b><span>${esc(picks.map(x => x.short).join(', '))} · ${money(picks.reduce((a, x) => a + x.fee, 0))}/yr in list fees per client</span></div><button class="btn primary" data-launchyes="1">Launch</button><button class="btn" data-launchno="1">Clear</button></div>` : ''}`;
  }

  /* ---------- growth: placeholders for later phases + rankings preview ---------- */
  function renderMore() {
    const t = C.nextTurn(S), people = C.activePeople(S, t);
    const r12 = C.revT12(S), firms = S.market.firms.filter(f => f.active);
    const rank = C.liveRank(S);
    const tail = firms.slice(-5);
    const top = firms.slice(0, 5);
    const ph = (title, phase, text) => `<section class="panel soonp"><div class="soon-h"><h2>${title}</h2><span class="pill soon">Phase ${phase}</span></div><p class="muted">${text}</p></section>`;
    return `<section class="panel"><div class="soon-h"><h2>People</h2><span class="pill on">${people.length} on staff</span></div>
        <p class="muted small">Hiring, teams and promotions are on the People tab.</p></section>
      ${UI.officesPanel ? UI.officesPanel() : ''}
      ${UI.techPanel ? UI.techPanel() : ''}
      ${UI.acqPanel ? UI.acqPanel() : ''}`;
  }

  /* ---------- settings ---------- */
  function renderSettings() {
    const groups = {};
    C.SETTINGS.forEach(r => (groups[r[4]] = groups[r[4]] || []).push(r));
    const fmt = (r, v) => r[5] === 'p' ? +(v * 100).toFixed(3) : v;
    return `<section class="panel"><h2>Game</h2>
      <div class="kv"><span>Seed in use</span><b class="num">${S.meta.seed}</b></div>
      <div class="kv"><span>Started</span><b>${C.monthLabel(S, 1)}</b></div>
      <div class="kv"><span>Months played</span><b class="num">${C.played(S)}</b></div>
      <div class="kv"><span>Version</span><b>${C.VERSION} (${C.PHASE})</b></div>
      ${confirmNew ? `<div class="confirm"><h3>Start a new game?</h3><p>This clears every month played, your services and your clients. It starts in ${C.MONTHS[new Date().getMonth()]} ${new Date().getFullYear()}.</p>
        <label class="field" for="ng-name"><span>Firm name</span><input id="ng-name" type="text" value="${esc(S.meta.firmName)}"></label>
        <label class="field" for="ng-seed"><span>Seed (blank = random)</span><input id="ng-seed" type="number" inputmode="numeric" placeholder="Random"></label>
        <div class="play"><button class="btn primary danger" data-act="newyes">Start new game</button><button class="btn" data-act="newno">Keep playing</button></div></div>`
        : `<div class="play"><button class="btn" data-act="newgame">New game…</button><button class="btn" data-act="tutorial">Show the tutorial<small>on this game</small></button></div>`}
      </section>
      <section class="panel"><h2>Play it like an app</h2><p class="muted small">Open this game's link in Safari on iPhone (or Chrome on Android), tap Share, then Add to Home Screen. It opens straight to the game, and your save stays on that phone.</p></section>
      <section class="panel"><h2>Saved game</h2><p class="muted small">Your game saves after every month and every answer, on this device and to your claude.ai account, so it's still there after you close the app and on any device where you're signed in. <span id="cloudstate">${cloudLabel()}</span> The save code below is a backup you can copy and paste.</p>
        <textarea id="savecode" rows="3" spellcheck="false" placeholder="Paste a save code here to load it"></textarea>
        <div class="play"><button class="btn" data-act="export">Copy save code</button><button class="btn" data-act="import">Load pasted code</button></div></section>
      ${Object.entries(groups).map(([g, rs]) => `<section class="panel"><h2>${g} settings</h2>${rs.map(r => `<label class="set" for="set-${r[0]}"><span>${esc(r[1])}<em>${r[3] === 'v2' ? 'new in version 2' : 'v1 ' + r[3]}${r[5] === 'p' ? ' · %' : r[5] === '$' ? ' · $' : ''}</em></span><input id="set-${r[0]}" data-set="${r[0]}" type="number" step="any" value="${fmt(r, S.settings[r[0]])}"></label>`).join('')}</section>`).join('')}
      <section class="panel"><p class="muted small">Dice tables, service parameters and roles use version 1's values. Settings changes apply from the next month played.</p><div class="play"><button class="btn" data-act="resetset">Restore version 1 settings</button></div></section>`;
  }

  /* ---------- cards (pop-ups) ---------- */
  UI.cardViews.month = (c) => {
    const d = c.data, ef = d.eventEffects;
    const effects = [ef.lead !== 1 && 'leads ×' + ef.lead, ef.churn && 'losses ' + (ef.churn > 0 ? '+' : '') + pct(ef.churn, 1) + '/mo', ef.cap !== 1 && 'capacity ×' + ef.cap, ef.cost && 'cost ' + money(ef.cost)].filter(Boolean).join(', ');
    return `<div class="dice"><div><span class="lbl">Event · roll ${d.eventRoll}</span><b>${esc(d.event)}</b><span>${effects || 'No effect'}</span></div><div><span class="lbl">Growth · roll ${d.growthRoll}</span><b>${esc(d.growthLabel)}</b><span>Leads ×${d.leadMult}</span></div></div>
      <div class="facts"><span>New <b class="num pos">+${d.newClients}</b></span><span>Lost <b class="num neg">${d.lostClients ? "−" + d.lostClients : 0}</b></span><span>Total <b class="num">${d.totalClients}</b></span></div>
      ${d.changes.length ? `<ul class="chg">${d.changes.map(x => `<li><span>${esc(x.name)}</span><b class="num">${x.new ? '+' + x.new : ''}${x.new && x.lost ? ' / ' : ''}${x.lost ? '−' + x.lost : ''}</b><em class="num">${x.end}</em></li>`).join('')}</ul>` : ''}
      <div class="kv"><span>Revenue</span><b class="num">${money(d.revenue)}</b></div><div class="kv"><span>Profit</span><b class="num ${d.profit < 0 ? 'neg' : ''}">${money(d.profit)}</b></div>
      <div class="kv"><span>Last 12 months</span><b class="num">${money(d.revT12)} rev · ${money(d.profitT12)} profit</b></div>
      ${false && d.january ? `<p class="note">New year: official rank ${esc(d.officialRank)}. The yearly IPA 500 update arrives in phase 4.</p>` : ''}
      <div class="kv"><span>Cash</span><b class="num ${d.cash < 0 ? 'neg' : ''}">${money(d.cash)}</b></div>${d.cash < 0 ? '<p class="warnline">You are out of cash.</p>' : ''}
      ${(d.extra || []).map(x => `<p class="note">${esc(x)}</p>`).join('')}`;
  };
  UI.cardViews.period = (c) => {
    const d = c.data;
    return `<p class="muted">${esc(d.from)} – ${esc(d.to)}</p>
      <div class="facts"><span>New <b class="num pos">+${d.newClients}</b></span><span>Lost <b class="num neg">${d.lostClients ? "−" + d.lostClients : 0}</b></span><span>Total <b class="num">${d.totalClients}</b></span></div>
      <div class="kv"><span>Revenue</span><b class="num">${money(d.revenue)}</b></div><div class="kv"><span>Profit</span><b class="num ${d.profit < 0 ? 'neg' : ''}">${money(d.profit)}</b></div><div class="kv"><span>Cash</span><b class="num ${d.cash < 0 ? 'neg' : ''}">${money(d.cash)}</b></div>${d.cash < 0 ? '<p class="warnline">You are out of cash.</p>' : ''}
      <ul class="chg">${d.months.map(m => `<li><span>${esc(m.label)}</span><b>${esc(m.event)}</b><em class="num">${money(m.revenue, true)}</em></li>`).join('')}</ul>`;
  };
  UI.cardViews.yearEnd = (c) => {
    const d = c.data;
    return `<div class="kv"><span>Revenue ${d.y}</span><b class="num">${money(d.revenue)}</b></div><div class="kv"><span>Profit ${d.y}</span><b class="num">${money(d.profit)}</b></div>
      <div class="kv"><span>Clients won / lost</span><b class="num">+${d.newClients} / ${d.lostClients ? "−" + d.lostClients : 0}</b></div>
      <div class="kv"><span>Busy-season workload (Jan–Apr)</span><b class="num">${d.busyWorkload ? pct(d.busyWorkload) : '—'}</b></div>
      <p class="note">You turn ${d.age}.</p>${(d.extra || []).map(x => `<p class="note">${esc(x)}</p>`).join('')}`;
  };
  UI.cardViews.launchOffer = (c) => `<p>Pick a service to start offering next month, or wait until next year.</p><div class="opts">${c.data.options.map(sl => { const x = S.services.find(v => v.slot === sl); return x && !x.offered ? `<button class="opt" data-ans="${sl}"><b>${esc(x.name)}</b><span>${esc(x.scope)} · ${money(x.fee)}/yr</span></button>` : ''; }).join('')}</div>`;

  function renderCard() {
    const c = S.queue[0], el = $('#sheet');
    if (!c) { el.hidden = true; el.innerHTML = ''; document.body.classList.remove('locked'); return; }
    const view = UI.cardViews[c.kind] || (() => '');
    const btns = (UI.cardButtons && UI.cardButtons(c)) || (c.type === 'launchOffer' ? `<button class="btn" data-ans="no">Not now</button>` : `<button class="btn primary" data-ans="ok">${S.queue.length > 1 ? 'Next' : 'Continue'}</button>`);
    el.innerHTML = `<div class="scrim"></div><div class="card" role="dialog" aria-modal="true" aria-labelledby="card-t"><div class="card-h"><span class="lbl">${S.queue.length > 1 ? '1 of ' + S.queue.length : c.kind === 'month' ? 'Month played' : ''}</span><h2 id="card-t">${esc(c.title)}</h2></div><div class="card-b">${view(c)}</div><div class="card-f">${btns}</div></div>`;
    el.hidden = false; document.body.classList.add('locked');
    const f = el.querySelector('.card-f .btn'); if (f) f.focus({ preventScroll: true });
  }

  /* ---------- events ---------- */
  function bind() {
    document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; launchPick = []; try { localStorage.setItem('cpaFirmSim.v2.tab', tab); } catch (e) { } render(); window.scrollTo(0, 0); });
    document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
      const a = b.dataset.act;
      if (a === 'month' || a === 'year') play(a);
      else if (a === 'newgame') { confirmNew = true; render(); }
      else if (a === 'newno') { confirmNew = false; render(); }
      else if (a === 'newyes') newGame();
      else if (a === 'tutorial') { S.meta.tutorial = 0; S.meta.tutorialPlayed = null; save(); UI.setTab('home'); }
      else if (a === 'resetset') { S.settings = C.defaultSettings(); save(); notice = 'Version 1 settings restored.'; render(); }
      else if (a === 'export') {
        const code = C.serialize(S), ta = $('#savecode'); ta.value = code;
        const ok = () => { notice = 'Save code copied.'; render(); };
        try { navigator.clipboard.writeText(code).then(ok, () => { ta.select(); }); } catch (e) { ta.select(); }
      } else if (a === 'import') {
        try { S = C.deserialize($('#savecode').value.trim()); save(); notice = 'Saved game loaded.'; tab = 'home'; } catch (e) { notice = 'That code could not be loaded. Paste the whole save code and try again.'; }
        render();
      }
    });
    document.querySelectorAll('[data-ans]').forEach(b => b.onclick = () => answer(S.queue[0].id, b.dataset.ans));
    if (S.queue[0] && UI.bindCard) UI.bindCard(answer, S.queue[0]);
    if (UI.bindOffices) UI.bindOffices(() => { save(); render(); });
    if (UI.bindMarket) UI.bindMarket(() => { save(); render(); });
    if (UI.bindPeople) UI.bindPeople(render, (a) => { if (C.busy(S)) return; if (a === 'hire') C.startHireFlow(S); else C.pushCard(S, { type: 'promoType', kind: 'choice', title: 'Promote someone', data: { lines: ['Pick a promotion. Seats come from open team spots; managers and directors need a CPA.'], options: [[1, 'Associate → Senior'], [2, 'Senior → Manager'], [3, 'Manager → Director'], [8, 'Admin Assistant → Admin Manager']].map(([v, l]) => ({ value: String(v), label: l, sub: C.activePeople(S, C.nextTurn(S)).filter(p => C.ROLE_INFO[p.role].lvl === v).length + ' people' })), buttons: [{ value: 'cancel', label: 'Cancel' }] } }); save(); render(); });
    document.querySelectorAll('[data-mkt]').forEach(b => b.onclick = () => { C.setDecisions(S, +b.dataset.mkt, null); save(); render(); });
    const mkt = $('#mkt'); if (mkt) mkt.onchange = () => { C.setDecisions(S, mkt.value, null); save(); render(); };
    const pr = $('#price'); if (pr) { pr.oninput = () => { $('#pricev').textContent = (pr.value > 0 ? '+' : '') + pr.value + '%'; }; pr.onchange = () => { C.setDecisions(S, null, pr.value / 100); save(); render(); }; }
    document.querySelectorAll('[data-launch]').forEach(b => b.onclick = () => { const sl = +b.dataset.launch, y = window.scrollY; launchPick = launchPick.includes(sl) ? launchPick.filter(v => v !== sl) : launchPick.concat(sl); render(); window.scrollTo(0, y); });
    document.querySelectorAll('[data-launchyes]').forEach(b => b.onclick = () => { const y = window.scrollY, done = launchPick.map(sl => S.services.find(v => v.slot === sl)).filter(x => C.launchService(S, x.slot)); if (done.length) notice = done.map(x => x.short).join(', ') + (done.length > 1 ? ' launch ' : ' launches ') + C.monthLabel(S, done[0].fromTurn) + '.'; launchPick = []; save(); render(); window.scrollTo(0, y); });
    document.querySelectorAll('[data-launchno]').forEach(b => b.onclick = () => { const y = window.scrollY; launchPick = []; render(); window.scrollTo(0, y); });
    document.querySelectorAll('[data-set]').forEach(i => i.onchange = () => { const r = C.SETTINGS.find(x => x[0] === i.dataset.set); let v = parseFloat(i.value); if (isNaN(v)) return; if (r[5] === 'p') v /= 100; S.settings[r[0]] = v; save(); notice = 'Saved: ' + r[1] + '.'; render(); });
  }

  /* ---------- boot ---------- */
  function start(hot) {
    const found = (hot && hot.save && (() => { try { return C.deserialize(hot.save); } catch (e) { return null; } })()) || load();
    S = found || C.newGame({});
    if (!found) S.meta.savedAt = 0; // a brand-new game never wins over a save in your account
    C.advance(S); try { localStorage.setItem(KEY, C.serialize(S)); } catch (e) { } render();
    initCloud();
    // A first visit is a new game: offer the tutorial (a save found in your account later replaces this game).
    if (!found && UI.askTutorial) UI.askTutorial(() => { if (C.played(S) === 0) startGame({ tutorial: true }); }, () => { });
  }
  try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ save: S ? C.serialize(S) : null })); } catch (e) { }
  // Boot after every module script has registered (people screen loads after this file).
  const boot = () => { const h = window.claude && window.claude.hot; if (h && h.ready) h.ready(start); else start((h && h.data) || {}); };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else setTimeout(boot, 0);
})();
</script>

<script>/* ===== CPA Firm Simulator v2 — OFFICES MODULE (phase 3) =====
   Offices in cities (HQ Rexburg, Idaho), desks, rent or buy, crowding, bigger space,
   owned buildings you keep, lease out or sell, who works where, admin managers by region,
   office-by-office promotions and directors per office. */
(function (G) {
  const C = G.CPA, R = C.rng, { clamp } = C.util;
  C.tagRegions();

  C.SETTINGS.push(
    ['officeScale', 'Offices trend-line revenue scale', 6049443, 'B128', 'Offices', '$'],
    ['officeExp', 'Offices trend-line exponent', 0.672, 'B183', 'Offices', 'n'],
    ['officeMaxGrowth', 'Most offices from growth alone', 150, 'B184', 'Offices', 'n'],
    ['offPerAdminMgr', 'Offices per regional admin manager', 4, 'B163', 'Offices', 'n'],
    ['deskSmall', 'Office size: small (desks)', 15, 'B194', 'Offices', 'n'],
    ['deskMedium', 'Office size: medium (desks)', 30, 'B195', 'Offices', 'n'],
    ['deskLarge', 'Office size: large (desks)', 60, 'B196', 'Offices', 'n'],
    ['deskXL', 'Office size: extra large (desks)', 150, 'B198', 'Offices', 'n'],
  );

  const fmt$ = (v) => (v < 0 ? '−$' : '$') + Math.abs(Math.round(v)).toLocaleString('en-US');
  const refTurn = (s) => s.cur ? s.cur.t : C.nextTurn(s);
  const info = (p) => C.ROLE_INFO[p.role] || {};
  const pick = (s, a) => a[Math.floor(R.next(s) * a.length)];
  const HQ = ['Rexburg, Idaho', 'ID'];

  C.officeFit = (s, rev) => rev <= 0 ? 0 : Math.min(s.settings.officeMaxGrowth, Math.pow(rev / s.settings.officeScale, s.settings.officeExp));
  C.officesAllowed = function (s) {
    let n = Math.round(C.officeFit(s, C.revT12(s)));
    if (n < 1 && C.roster(s, refTurn(s)).some(p => info(p).dept === 'Admin')) n = 1;
    return n;
  };
  C.officeNo = (s, id) => s.offices.findIndex(o => o.id === id) + 1;
  C.officeById = (s, id) => s.offices.find(o => o.id === id);
  C.officeLabel = (s, o) => '#' + C.officeNo(s, o.id) + ' ' + C.cityBase(o.city);
  C.peopleIn = (s, oid, t = refTurn(s)) => C.roster(s, t).filter(p => p.office === oid && p.startTurn <= Math.max(t, C.nextTurn(s)));
  C.officeMonthlyCost = (s, o) => C.officeSpaceCost(s, o);
  C.sizeDesks = (s, k) => ({ 1: s.settings.deskSmall, 2: s.settings.deskMedium, 3: s.settings.deskLarge, 4: s.settings.deskXL })[k];
  C.cashNow = (s) => C.cash(s);

  /* ---------- Who works where ---------- */
  const teamOffice = (s) => (s.teamOffice = s.teamOffice || {});
  C.teamOfficeOf = (s, k) => teamOffice(s)[k] || null;
  function fewest(s, t, pred) {
    const ros = C.roster(s, t);
    return s.offices.map(o => ({ o, n: ros.filter(p => p.office === o.id && pred(p)).length, all: ros.filter(p => p.office === o.id).length }))
      .sort((a, b) => a.n - b.n || a.all - b.all || C.officeNo(s, a.o.id) - C.officeNo(s, b.o.id))[0].o.id;
  }
  C.placeOffices = function (s, t = refTurn(s)) {
    if (!s.offices.length) { s.people.forEach(p => { p.office = null; }); s.teamOffice = {}; return; }
    const ids = new Set(s.offices.map(o => o.id)), to = teamOffice(s);
    Object.keys(to).forEach(k => { if (!ids.has(to[k])) delete to[k]; });
    const ros = C.roster(s, t);
    ros.forEach(p => { if (p.office != null && !ids.has(p.office)) p.office = null; });
    // team members follow their team; a new team goes to the office with the fewest teams
    ros.filter(p => p.team != null).forEach(p => {
      if (!to[p.team]) { const counts = s.offices.map(o => ({ id: o.id, n: Object.values(to).filter(v => v === o.id).length })); counts.sort((a, b) => a.n - b.n || C.officeNo(s, a.id) - C.officeNo(s, b.id)); to[p.team] = p.office && ids.has(p.office) ? p.office : counts[0].id; }
      p.office = to[p.team];
    });
    ros.filter(p => p.office == null).sort((a, b) => a.id - b.id).forEach(p => {
      const i = info(p);
      if (p.id === 1) p.office = s.offices[0].id;
      else if (i.lvl === 4) p.office = fewest(s, t, q => info(q).lvl === 4);
      else if (p.role === 'Admin Assistant') p.office = fewest(s, t, q => q.role === 'Admin Assistant');
      else if (p.role === 'Admin Manager') p.office = fewest(s, t, q => q.role === 'Admin Manager');
      else p.office = fewest(s, t, () => true);
    });
  };

  /* ---------- Office actions ---------- */
  C.suggestCities = function (s, n = 6) {
    const used = new Set(s.offices.map(o => o.city));
    if (!s.offices.length) return [HQ].concat(C.GEO.cities.filter(c => c[1] === 'ID' && c[0] !== HQ[0]).slice(0, n - 1));
    const home = s.offices[0].state, near = [home, ...(C.GEO.states[home] || [])];
    const pool = C.GEO.cities.filter(c => !used.has(c[0]) && near.includes(c[1]));
    const same = pool.filter(c => c[1] === home), other = pool.filter(c => c[1] !== home), out = [];
    while (out.length < n && (same.length || other.length)) {
      const src = (R.next(s) < 0.6 && same.length) || !other.length ? same : other;
      out.push(src.splice(Math.floor(R.next(s) * src.length), 1)[0]);
    }
    return out;
  };
  C.openOffice = function (s, city, st, desks, owned, how) {
    const cost = owned ? desks * s.settings.buyPerDesk : 0;
    if (owned && cost > C.cash(s)) return { ok: false, why: 'Buying ' + desks + ' desks costs ' + fmt$(cost) + ', more than your cash (' + fmt$(C.cash(s)) + ').' };
    s.meta.nextOffice = (s.meta.nextOffice || 0) + 1;
    const o = { id: s.meta.nextOffice, city, state: st, region: C.cityRegion(city, st), opened: refTurn(s), how: how || (s.offices.length ? 'Opened' : 'Main office'), desks, owned: !!owned };
    s.offices.push(o); s.pendingOut += cost;
    C.placeOffices(s);
    return { ok: true, office: o };
  };
  C.changeSpace = function (s, oid, desks, owned) {
    const o = C.officeById(s, oid); if (!o) return { ok: false };
    const cost = owned ? desks * s.settings.buyPerDesk : 0;
    if (owned && cost > C.cash(s)) return { ok: false, why: 'Buying ' + desks + ' desks costs ' + fmt$(cost) + ', more than your cash (' + fmt$(C.cash(s)) + ').' };
    const old = { desks: o.desks, owned: o.owned };
    o.desks = desks; o.owned = !!owned; s.pendingOut += cost;
    return { ok: true, old };
  };
  C.sellBuilding = (s, desks) => { s.pendingOut -= desks * s.settings.buyPerDesk; };
  C.closeOffice = function (s, oid, destId) {
    const o = C.officeById(s, oid); if (!o || s.offices.length < 2 || oid === destId) return false;
    C.roster(s, refTurn(s)).forEach(p => { if (p.office === oid) p.office = destId; });
    const to = teamOffice(s); Object.keys(to).forEach(k => { if (to[k] === oid) to[k] = destId; });
    if (o.owned) C.sellBuilding(s, o.desks);
    s.offices = s.offices.filter(x => x.id !== oid);
    C.placeOffices(s);
    return true;
  };
  C.moveGroups = function (s, fromId, groups, toId) {
    const to = teamOffice(s), ros = C.roster(s, refTurn(s));
    groups.forEach(g => {
      if (g.startsWith('team:')) { const k = +g.slice(5); to[k] = toId; ros.filter(p => p.team === k).forEach(p => p.office = toId); }
      else if (g.startsWith('p:')) { const p = s.people.find(x => x.id === +g.slice(2)); if (p) p.office = toId; }
    });
  };
  function moveGroupsOf(s, oid) {
    const ros = C.roster(s, refTurn(s)).filter(p => p.office === oid), out = [];
    const teams = [...new Set(ros.filter(p => p.team != null).map(p => p.team))].sort((a, b) => a - b);
    const plan = C.teams(s);
    teams.forEach(k => { const tk = plan.find(x => x.id === k); out.push({ value: 'team:' + k, label: 'Team ' + k + (tk && tk.dept ? ' · ' + tk.dept : ''), sub: ros.filter(p => p.team === k).length + ' people' }); });
    ros.filter(p => p.team == null).forEach(p => out.push({ value: 'p:' + p.id, label: p.name, sub: p.role }));
    return out;
  }

  /* ---------- Leadership by office (patches the people plan) ---------- */
  const basePlan = C.teamPlan;
  C.teamPlan = function (s, t = refTurn(s)) {
    const pl = basePlan(s, t);
    if (!s.offices.length) return pl;
    const ros = C.roster(s, t), you = +s.settings.youLeadAlways || C.revT12(s) < s.settings.actAsDirectorUntil;
    const noDir = s.offices.filter((o, i) => !ros.some(p => p.office === o.id && info(p).lvl === 4) && !(you && i === 0));
    pl.officesNoDirector = noDir;
    pl.gap += noDir.length;
    const depts = ['CAS', 'Tax', 'Audit'];
    if (noDir.length && depts.every(d => pl.byD[d].dirSeats === 0)) {
      const best = depts.filter(d => C.roleUseful(s, C.roleFor(d, 1))).sort((a, b) => pl.byD[b].teams - pl.byD[a].teams)[0];
      if (best) pl.byD[best].dirSeats = 1;
    }
    return pl;
  };
  // Office-by-office promotion seats for seniors (to=2) and managers (to=3)
  C.promoScopes = function (s, d, toLvl, t) {
    if (!s.offices.length || toLvl === 4) return null;
    const ks = C.teams(s, t).filter(k => k.dept === d);
    return s.offices.map(o => {
      const mine = ks.filter(k => C.teamOfficeOf(s, k.id) === o.id);
      const seats = toLvl === 3 ? mine.filter(k => k.mgrRoom > 0).length : mine.reduce((a, k) => a + k.srRoom, 0);
      return { office: o, seats, teams: mine.map(k => k.id) };
    }).filter(x => x.seats > 0);
  };

  // New hires get an office straight away (an outside hire for an office's opening goes there)
  const baseHire = C.hire;
  C.hire = function (s, c, opts) { const p = baseHire(s, c, opts); if (s.meta.hireOffice && C.officeById(s, s.meta.hireOffice)) { p.office = s.meta.hireOffice; if (p.team != null) s.teamOffice[p.team] = s.teamOffice[p.team] || p.office; } C.placeOffices(s); return p; };

  /* ---------- Module ---------- */
  C.register({
    id: 'offices',
    init(s) { s.teamOffice = {}; s.properties = []; s.meta.nextOffice = 0; },
    migrate(s) { s.teamOffice = s.teamOffice || {}; s.properties = s.properties || []; s.meta.nextOffice = s.meta.nextOffice || s.offices.reduce((a, o) => Math.max(a, o.id || 0), 0); s.meta.cool = s.meta.cool || {}; },
    hooks: {
      housekeeping(s) { C.placeOffices(s, C.nextTurn(s)); },
      extraCost(s) { return (s.properties || []).reduce((a, b) => a + (b.status === 'leased' ? -(b.desks * s.settings.rentPerDesk - b.desks * s.settings.upkeepPerDesk) : b.desks * s.settings.upkeepPerDesk), 0); },
      summaryLines(s) { const crowded = s.offices.filter(o => C.peopleIn(s, o.id, C.played(s)).length > o.desks); return crowded.length ? ['Crowded: ' + crowded.map(o => C.cityBase(o.city)).join(', ') + ' (10% less client work there).'] : []; },
    },
    stages: [
      { id: 'officeDecisions', after: 'peopleDecisions', run(s, cur) { if (cur.t >= 2) officeDecisions(s, cur.t); } },
    ],
    cards: {
      officeAsk(s, card, a) { if (a && a.v === 'yes') cityCard(s, 'new'); },
      officeCity(s, card, a) {
        if (!a || a.v === 'cancel') return;
        let city, st;
        if (a.v === 'typed') {
          const txt = String(a.n || '').trim(); const hit = C.GEO.cities.find(c => c[0].toLowerCase() === txt.toLowerCase() || C.cityBase(c[0]).toLowerCase() === txt.toLowerCase());
          if (!hit) { C.pushCardFront(s, { type: 'info', kind: 'choice', title: 'City not found', data: { lines: ['"' + txt + '" isn\'t on the city list. Pick a suggested city or type one as it appears, for example "Boise" or "Logan, Utah".'] } }); return cityCard(s, card.data.mode, card.data.after); }
          city = hit[0]; st = hit[1];
        } else { const c = C.GEO.cities.find(x => x[0] === a.v) || HQ; city = c[0]; st = c[1]; }
        sizeCard(s, { mode: 'new', city, st, after: card.data.after });
      },
      officeSize(s, card, a) {
        if (!a || a.v === 'cancel') { if (card.data.mode === 'new') { const r = C.openOffice(s, card.data.city, card.data.st, s.settings.deskSmall, false); if (r.ok) afterOpen(s, r.office, card.data); } return; }
        let desks, owned;
        if (a.v === 'custom') { desks = Math.max(1, Math.round(+a.n || 0)); owned = false; } else { owned = a.v[0] === 'b'; desks = +a.v.slice(1); }
        if (!desks) return;
        if (card.data.mode === 'new') {
          const r = C.openOffice(s, card.data.city, card.data.st, desks, owned);
          if (!r.ok) { C.pushCardFront(s, { type: 'info', kind: 'choice', title: 'Not enough cash', data: { lines: [r.why] } }); return sizeCard(s, card.data, true); }
          afterOpen(s, r.office, card.data);
        } else {
          const o = C.officeById(s, card.data.officeId), wasOwned = o && o.owned, oldDesks = o && o.desks;
          const r = C.changeSpace(s, card.data.officeId, desks, owned);
          if (!r.ok) { C.pushCardFront(s, { type: 'info', kind: 'choice', title: 'Not enough cash', data: { lines: [r.why] } }); return; }
          if (wasOwned) buildingCard(s, o.city, o.state, oldDesks);
        }
      },
      oldBuilding(s, card, a) {
        const d = card.data, v = a && a.v;
        if (v === 'keep' || v === 'lease') { s.meta.nextProp = (s.meta.nextProp || 0) + 1; s.properties.push({ id: s.meta.nextProp, city: d.city, state: d.st, desks: d.desks, status: v === 'keep' ? 'kept' : 'leased' }); }
        else C.sellBuilding(s, d.desks);
      },
      moveAsk(s, card, a) { if (a && a.v === 'yes') moveFromCard(s, card.data.to); },
      moveFrom(s, card, a) { if (!a || a.v === 'cancel') return; const from = +a.v; const opts = moveGroupsOf(s, from); if (!opts.length) return; C.pushCardFront(s, { type: 'moveWhat', kind: 'choice', title: 'Move from ' + C.cityBase(C.officeById(s, from).city), data: { from, to: card.data.to, lines: ['Pick who moves. A team always moves together.'], options: opts, multi: { max: opts.length }, buttons: [{ value: 'ok', label: 'Next', primary: true }, { value: 'cancel', label: 'Cancel' }] } }); },
      moveWhat(s, card, a) {
        if (!a || a.v !== 'ok' || !(a.picked || []).length) return; const d = card.data;
        if (d.to) return finishMove(s, d.from, a.picked, d.to);
        C.pushCardFront(s, { type: 'moveTo', kind: 'choice', title: 'Move to which office?', data: { from: d.from, groups: a.picked, options: s.offices.filter(o => o.id !== d.from).map(o => ({ value: String(o.id), label: C.officeLabel(s, o), sub: C.peopleIn(s, o.id).length + ' people · ' + o.desks + ' desks' })), buttons: [{ value: 'cancel', label: 'Cancel' }] } });
      },
      moveTo(s, card, a) { if (!a || a.v === 'cancel') return; finishMove(s, card.data.from, card.data.groups, +a.v); },
      closePick(s, card, a) { if (!a || a.v === 'cancel') return; const oid = +a.v; C.pushCardFront(s, { type: 'closeDest', kind: 'choice', title: 'Close ' + C.cityBase(C.officeById(s, oid).city) + '?', data: { oid, lines: [C.peopleIn(s, oid).length + ' people work here. Pick where they move.' + (C.officeById(s, oid).owned ? ' The building sells for ' + fmt$(C.officeById(s, oid).desks * s.settings.buyPerDesk) + '.' : '')], options: s.offices.filter(o => o.id !== oid).map(o => ({ value: String(o.id), label: C.officeLabel(s, o), sub: C.peopleIn(s, o.id).length + ' people · ' + o.desks + ' desks' })), buttons: [{ value: 'cancel', label: 'Keep it open' }] } }); },
      closeDest(s, card, a) { if (!a || a.v === 'cancel') return; const name = C.cityBase(C.officeById(s, card.data.oid).city); if (C.closeOffice(s, card.data.oid, +a.v)) C.pushCardFront(s, { type: 'info', kind: 'choice', title: name + ' closed', data: { lines: ['Everyone moved to ' + C.cityBase(C.officeById(s, +a.v).city) + '.'] } }); },
      spacePick(s, card, a) { if (!a || a.v === 'cancel') return; sizeCard(s, { mode: 'resize', officeId: +a.v }); },
      desksFull(s, card, a) {
        const v = a && a.v, o = C.officeById(s, card.data.oid); if (!o) return;
        const need = Math.ceil(C.peopleIn(s, o.id).length * 1.25 / 5) * 5;
        if (v === 'rent' || v === 'buy') { const was = o.owned, old = o.desks; const r = C.changeSpace(s, o.id, Math.max(need, o.desks + 5), v === 'buy'); if (!r.ok) C.pushCardFront(s, { type: 'info', kind: 'choice', title: 'Not enough cash', data: { lines: [r.why] } }); else if (was) buildingCard(s, o.city, o.state, old); }
        else if (v === 'open') cityCard(s, 'new', { moveFrom: o.id });
      },
      propAction(s, card, a) { },
    },
  });

  /* ---------- Card builders ---------- */
  function cityCard(s, mode, after) {
    const sug = C.suggestCities(s);
    C.pushCardFront(s, { type: 'officeCity', kind: 'choice', title: s.offices.length ? 'Where is the new office?' : 'Open your first office', data: { mode, after, lines: [s.offices.length ? 'Suggested cities near ' + C.cityBase(s.offices[0].city) + ' (60% in the same state).' : 'Your first office is your headquarters.'], options: sug.map(c => ({ value: c[0], label: c[0], sub: C.cityRegion(c[0], c[1]) })), input: { type: 'text', label: 'Or type a city from the list', value: '' }, buttons: [{ value: 'typed', label: 'Use typed city' }, { value: 'cancel', label: 'Cancel' }] } });
  }
  function sizeCard(s, d, front = true) {
    const st = s.settings, staff = C.roster(s, refTurn(s)).length;
    const o = d.officeId ? C.officeById(s, d.officeId) : null;
    const here = o ? C.peopleIn(s, o.id).length : staff;
    const suggest = o ? Math.ceil(here * 1.25 / 5) * 5 : Math.max(5, Math.round(1.3 * staff));
    const opts = [];
    [1, 2, 3, 4].forEach(k => { const n = C.sizeDesks(s, k), nm = ['Small', 'Medium', 'Large', 'Extra large'][k - 1]; opts.push({ value: 'r' + n, label: nm + ' · ' + n + ' desks · rent', sub: fmt$(n * st.rentPerDesk) + '/month' }); opts.push({ value: 'b' + n, label: nm + ' · ' + n + ' desks · buy', sub: fmt$(n * st.buyPerDesk) + ' now, then ' + fmt$(n * st.upkeepPerDesk) + '/month upkeep', disabled: n * st.buyPerDesk > C.cash(s) }); });
    const title = d.mode === 'new' ? 'Office size · ' + C.cityBase(d.city) : 'New space · ' + C.cityBase(o.city);
    const card = { type: 'officeSize', kind: 'choice', title, data: Object.assign({}, d, { lines: [(d.mode === 'new' ? 'Staff now: ' + staff : here + ' people work here, on ' + o.desks + ' desks (' + (o.owned ? 'owned' : 'rented') + ').') + ' Suggested: about ' + suggest + ' desks. Cash ' + fmt$(C.cash(s)) + '.', ...(o && o.owned ? ['You\'ll choose what happens to the building you own now.'] : [])], options: opts, input: { label: 'Custom size (desks, rented)', min: 1, max: 1000, value: suggest }, buttons: [{ value: 'custom', label: 'Rent custom size' }, { value: 'cancel', label: d.mode === 'new' ? 'Default: 15 rented' : 'Cancel' }] }) };
    (front ? C.pushCardFront : C.pushCard)(s, card);
  }
  function buildingCard(s, city, st, desks) {
    const S = s.settings;
    C.pushCardFront(s, { type: 'oldBuilding', kind: 'choice', title: 'Your old building in ' + C.cityBase(city), data: { city, st, desks, lines: ['You own the ' + desks + '-desk building you\'re moving out of.'], options: [{ value: 'sell', label: 'Sell it', sub: fmt$(desks * S.buyPerDesk) + ' cash now' }, { value: 'keep', label: 'Keep it empty', sub: 'Upkeep ' + fmt$(desks * S.upkeepPerDesk) + '/month; sell or lease later' }, { value: 'lease', label: 'Lease it out', sub: 'Net ' + fmt$(desks * (S.rentPerDesk - S.upkeepPerDesk)) + '/month' }] } });
  }
  function afterOpen(s, o, d) {
    const lines = [C.cityBase(o.city) + ' (' + o.region + ') opens with ' + o.desks + ' desks, ' + (o.owned ? 'owned' : 'rented') + '.'];
    if (s.offices.length > 1) {
      if (d.after && d.after.moveFrom) moveFromCard(s, o.id, d.after.moveFrom);
      else C.pushCardFront(s, { type: 'moveAsk', kind: 'choice', title: 'Move teams into ' + C.cityBase(o.city) + '?', data: { to: o.id, lines: ['Each office needs a director. You cover your main office until revenue reaches $2M.'], buttons: [{ value: 'yes', label: 'Move people', primary: true }, { value: 'no', label: 'Not now' }] } });
    }
    C.pushCardFront(s, { type: 'info', kind: 'choice', title: 'Office opened', data: { lines } });
  }
  function moveFromCard(s, to, from) {
    if (from) { const opts = moveGroupsOf(s, from); if (opts.length) C.pushCardFront(s, { type: 'moveWhat', kind: 'choice', title: 'Move from ' + C.cityBase(C.officeById(s, from).city), data: { from, to, lines: ['Pick who moves. A team always moves together.'], options: opts, multi: { max: opts.length }, buttons: [{ value: 'ok', label: 'Move', primary: true }, { value: 'cancel', label: 'Cancel' }] } }); return; }
    C.pushCardFront(s, { type: 'moveFrom', kind: 'choice', title: 'Move people from which office?', data: { to, options: s.offices.filter(o => o.id !== to).map(o => ({ value: String(o.id), label: C.officeLabel(s, o), sub: C.peopleIn(s, o.id).length + ' people' })), buttons: [{ value: 'cancel', label: 'Cancel' }] } });
  }
  function finishMove(s, from, groups, to) {
    C.moveGroups(s, from, groups, to);
    const o = C.officeById(s, to), n = C.peopleIn(s, to).length;
    C.pushCardFront(s, { type: 'info', kind: 'choice', title: 'Moved', data: { lines: [groups.length + ' group(s) moved to ' + C.cityBase(o.city) + '.', n > o.desks ? C.cityBase(o.city) + ' now has ' + n + ' people on ' + o.desks + ' desks, so it is crowded.' : '', 'Each office needs a director.'].filter(Boolean) } });
  }
  // Buttons on the Offices screen
  C.officeAction = function (s, act, oid) {
    if (act === 'open') return cityCard(s, 'new');
    if (act === 'move') return s.offices.length > 1 ? moveFromCard(s, null) : null;
    if (act === 'space') return sizeCard(s, { mode: 'resize', officeId: oid });
    if (act === 'close') return C.pushCardFront(s, { type: 'closePick', kind: 'choice', title: 'Close an office', data: { options: [{ value: String(oid), label: C.officeLabel(s, C.officeById(s, oid)) }], buttons: [{ value: 'cancel', label: 'Cancel' }] } });
  };
  C.propertyAction = function (s, id, act) {
    const b = s.properties.find(x => x.id === id); if (!b) return;
    if (act === 'sell') { C.sellBuilding(s, b.desks); s.properties = s.properties.filter(x => x.id !== id); }
    else if (act === 'lease') b.status = 'leased'; else if (act === 'unlease') b.status = 'kept';
  };

  /* ---------- Monthly decisions: open an office, out of desks ---------- */
  function officeDecisions(s, t) {
    const cool = s.meta.cool, st = s.settings, ready = (k) => !(cool[k] && t < cool[k]);
    const allowed = C.officesAllowed(s);
    if (allowed > s.offices.length && ready('office')) {
      cool.office = t + st.reminderMonths;
      C.pushCard(s, { type: 'officeAsk', kind: 'choice', title: s.offices.length ? 'Open another office?' : 'Open your first office?', data: { lines: ['Your revenue supports ' + allowed + ' office' + (allowed > 1 ? 's' : '') + '; you have ' + s.offices.length + '.', s.offices.length ? 'Base overhead stays ' + fmt$(st.overheadOffice) + '/month; the new space adds rent or upkeep, plus ' + st.adminPerOffice + ' hours of admin work a month.' : 'Going from remote to an office raises base overhead from ' + fmt$(st.overheadRemote) + ' to ' + fmt$(st.overheadOffice) + ' a month, plus rent or upkeep and ' + st.adminPerOffice + ' hours of admin work a month.'], buttons: [{ value: 'yes', label: 'Open an office', primary: true }, { value: 'no', label: 'Wait 3 months' }] } });
    }
    if (ready('desks')) {
      const full = s.offices.find(o => C.peopleIn(s, o.id, t).length > o.desks);
      if (full) {
        cool.desks = t + st.reminderMonths;
        const n = C.peopleIn(s, full.id, t).length, need = Math.ceil(n * 1.25 / 5) * 5;
        C.pushCard(s, { type: 'desksFull', kind: 'choice', title: C.cityBase(full.city).toUpperCase() + ' IS OUT OF DESKS', data: { oid: full.id, lines: [n + ' people on ' + full.desks + ' desks. Everyone there gets 10% less client work done.'], options: [{ value: 'rent', label: 'Move to a bigger rented space', sub: need + ' desks · ' + fmt$(need * st.rentPerDesk) + '/month' }, { value: 'buy', label: 'Buy a bigger building', sub: need + ' desks · ' + fmt$(need * st.buyPerDesk) + ' now', disabled: need * st.buyPerDesk > C.cash(s) }, { value: 'open', label: 'Open another office', sub: 'Then move teams into it' }], buttons: [{ value: 'leave', label: 'Leave it' }] } });
      }
    }
  }
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* ===== CPA Firm Simulator v2 — PEOPLE UPGRADES (phase 6) =====
   1 Specialty departments (Valuation, Forensic)   2 Campus recruiters by region + HR team
   3 CIA / CFE / CISA / CMA                          4 Pay by degree
   5 Schools that matter (tiers, pipelines)          6 You lead two teams of any department
   7 Team specializations once a department has 4 teams. Decided with Jaye on Nov 2, 2026. */
(function (G) {

  };
  // Phase 10: one pass over people and teams for every office (was one pass per office; slow for big firms)
  function officeCounts(s, t) {
    const to = s.teamOffice || {}, nt = Math.max(t, C.nextTurn(s)), c = new Map(s.offices.map(o => [o.id, { teams: 0, dirsAll: 0, dirsIn: 0, pplIn: 0 }]));
    C.teams(s, t).forEach(k => { const x = c.get(to[k.id]); if (x) x.teams++; });
    C.roster(s, t).forEach(p => { const x = c.get(p.office); if (!x) return; const d = info(p).lvl === 4; if (d) x.dirsAll++; if (p.startTurn <= nt) { x.pplIn++; if (d) x.dirsIn++; } });
    return c;
  }
  C.officeRoom = function (s, t = refTurn(s)) {
    if (!s.offices.length) return null;
    const c = officeCounts(s, t);
    let team = 0, dir = 0; s.offices.forEach(o => { const x = c.get(o.id); team += Math.max(0, C.officeTeamCap(s, o) - x.teams); dir += Math.max(0, x.dirsIn + Math.max(0, o.desks - x.pplIn) - x.dirsAll); });
    return { team, dir };
  };
  const basePlan = C.teamPlan;
  C.teamPlan = function (s, t = refTurn(s)) {
    const pl = basePlan(s, t), room = C.officeRoom(s, t);
    if (!room) return pl;
    pl.officeRoom = room;
    C.DEPTS.forEach(d => { const x = pl.byD[d]; if (!x) return; x.newRoom = Math.min(x.newRoom, room.team); });
    let dirLeft = room.dir;
    C.DEPTS.forEach(d => { const x = pl.byD[d]; if (!x) return; x.dirSeatsWanted = x.dirSeats; x.dirSeats = Math.min(x.dirSeats, dirLeft); dirLeft -= x.dirSeats; });
    pl.officeFull = room.team <= 0 || (room.dir <= 0 && C.DEPTS.some(d => pl.byD[d] && pl.byD[d].dirSeatsWanted > 0));
    return pl;
  };
  // New teams and new directors go to an office with room
  const basePlace = C.placeOffices;
  C.placeOffices = function (s, t = refTurn(s)) {
    if (s.offices.length) {
      const to = (s.teamOffice = s.teamOffice || {}), ros = C.roster(s, t), c = officeCounts(s, t);
      const best = (score) => s.offices.reduce((b, o) => (b == null || score(o) > score(b) ? o : b), null); // first office wins ties, as before
      // each new team goes to the office with the most free team room (once per team, not once per member)
      new Set(ros.filter(p => p.team != null && !to[p.team]).map(p => p.team)).forEach(team => {
        const o = best(o => C.officeTeamCap(s, o) - c.get(o.id).teams); to[team] = o.id; c.get(o.id).teams++;
      });
      ros.filter(p => info(p).lvl === 4 && (p.office == null || !s.offices.some(o => o.id === p.office))).forEach(p => {
        const o = best(o => { const x = c.get(o.id); return x.dirsIn + Math.max(0, o.desks - x.pplIn) - x.dirsAll; });
        p.office = o.id; const x = c.get(o.id); x.dirsAll++; if (p.startTurn <= Math.max(t, C.nextTurn(s))) { x.dirsIn++; x.pplIn++; }
      });
    }
    return basePlace(s, t);
  };
  function officeFullCheck(s, t) {
    if (!s.offices.length) return;
    const cool = s.meta.cool = s.meta.cool || {};
    if (cool.officeFull && t < cool.officeFull) return;
    const pl = C.teamPlan(s, t);
    const waiting = pl.unassigned.length > 0 || pl.gap > 0;
    if (!pl.officeFull || !waiting) return;
    cool.officeFull = t + s.settings.reminderMonths;
    const o = s.offices.map(o => ({ o, l: C.officeLoad(s, o, t) })).sort((a, b) => (b.l.teams - b.l.teamCap) - (a.l.teams - a.l.teamCap))[0].o;
    C.pushCard(s, { type: 'officeFullAsk', kind: 'choice', title: 'Your offices are full', data: { oid: o.id, lines: ['Each office holds 1 team per ' + s.settings.desksPerTeam + ' desks, and directors need a free desk. ' + (pl.officeRoom.team <= 0 ? 'No office has room for another team.' : 'No office has a free desk for another director.'), C.cityBase(o.city) + ' has ' + o.desks + ' desks.'], options: [{ value: 'space', label: 'Get more space in ' + C.cityBase(o.city) }, { value: 'open', label: 'Open another office' }], buttons: [{ value: 'leave', label: 'Not now' }] } });
  }

  C.register({
    id: 'services2',
    init(s) { C.NEW_SERVICES.forEach(r => { if (!s.services.some(x => x.slot === r[0])) s.services.push(svcFrom(r)); }); },
    migrate(s) { C.NEW_SERVICES.forEach(r => { if (!s.services.some(x => x.slot === r[0])) s.services.push(svcFrom(r)); }); },
    hooks: { serviceMods },
    stages: [{ id: 'officeFull', after: 'officeDecisions', run(s, cur) { if (cur.t >= 2) officeFullCheck(s, cur.t); } }],
    cards: { officeFullAsk(s, card, a) { if (!a) return; if (a.v === 'space') C.officeAction(s, 'space', card.data.oid); else if (a.v === 'open') C.officeAction(s, 'open'); } },
  });
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>/* ===== Offices panel (phase 3) — shown on the Growth tab ===== */

  const fmt$ = (v) => (v < 0 ? '−$' : '$') + Math.abs(Math.round(v)).toLocaleString('en-US');

  /* ---------- January market update (spec "January update") ---------- */
  C.marketUpdate = function (s, t) {
    const st = s.settings, y = C.monthOf(s, t).y, mk = s.market, firms = listed(s), breaking = [];
    mk.firms.forEach(f => { f.lastRank = f.active ? f.rank : null; f.news = ''; });
    // growth
    firms.forEach((f, i) => {
      const r = i + 1, top = r <= 10;
      let g = (top ? st.g1to10 : r <= 50 ? st.g11to50 : st.g51) + f.trend + (top ? st.gNoiseTop : st.gNoise) * R.normal(s) + st.marketAdj + (f.pe ? (st.peGrowth || 0) : 0);
      if (!top && R.next(s) < st.setbackChance) { g -= R.uniform(s, st.setbackMin, st.setbackMax); f.news = 'Setback year'; }

        const ts = lst.filter(f => f.active && f !== buyer && !used.has(f.id) && f.revenue >= buyer.revenue * st.mergeMinPct && f.revenue <= buyer.revenue * maxPct && (maxPct <= st.mergeMaxPct || lst.indexOf(f) >= 10) && lst.indexOf(f) >= 4); // the top 10 never fall to a smaller buyer; the Big Four are never bought (v2)
