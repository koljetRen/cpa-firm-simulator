      for (let k = 0; k < tries; k++) if (R.next(s) < p) { const add = r500 * R.uniform(s, st.outsideMin, st.outsideMax), nm = C.firmName(s); f.revenue += add; f.offices += Math.round(C.officeFit(s, add)); f._buys = (f._buys || 0) + 1; f._buyNews = f._buys > 1 ? 'Bought ' + f._buys + ' firms' : 'Bought ' + nm; log(s, y, 'Outside acquisition', f.name, nm, add, f.revenue); } });
    listed(s).forEach(f => { if (f._buys) { f.news = (f.news ? f.news + '; ' : '') + f._buyNews; delete f._buys; delete f._buyNews; } });
    // offices follow the trend line
    listed(s).forEach(f => { f.offices = Math.max(f.offices, Math.min(st.officeMaxGrowth, Math.round(C.officeFit(s, f.revenue))), 1); });
    // your firm joins?
    const comp = listed(s);
    const youIn = comp.length >= 500 ? yourRev > comp[499].revenue : yourRev > 0 && comp.length && yourRev > comp[comp.length - 1].revenue;
    const spots = youIn ? 499 : 500;

  // Live rank uses the listed firms only
  C.liveRank = function (s) {
    const l = listed(s), rev = C.revT12(s);
    if (!l.length || rev <= l[l.length - 1].revenue) return '500+';
    return 1 + l.filter(f => f.revenue > rev).length;

  /* ---------- Practices for sale (New Game and every January) ---------- */
  const avgProfit = (s) => { const L = s.history.log.slice(-12); return L.length ? L.reduce((a, r) => a + r.profit, 0) / L.length : 0; };
  C.revenueBase = (s) => Math.max(C.revT12(s), s.services.reduce((a, x) => a + x.clients * x.fee, 0));
  function specialtyLines(s, rev) {
    return SPECIALTY.filter(([slot, cut]) => rev >= cut && R.next(s) < 0.25 + 0.5 * Math.min(1, Math.log(rev / cut) / Math.log(5))).map(x => x[0]);
  }
  function clientMix(s, rev, lines) {
    const svc = s.services.filter(x => (x.offered || lines.includes(x.slot)) && x.type !== 'Project' && x.acqMix > 0);
    const W = svc.reduce((a, x) => a + x.acqMix, 0), mix = {};
    svc.forEach(x => { const c = Math.round(rev * x.acqMix / W / x.fee); if (c > 0) mix[x.slot] = c; });

  function dealOffices(s, rev, mainCity, firmOffices) {

    for (let k = 1; k < n && k < 12; k++) { const c = rev < s.settings.nearOfficeBelow || R.next(s) < 0.35 ? nearCity(s, mainCity[1]) : randomCity(s); if (!cities.some(x => x[0] === c[0])) cities.push(c); }

  function buildDeal(s, d) {
    const st = s.settings;

    d.lines = d.lines || specialtyLines(s, d.revenue);

  C.generatePractices = function (s) {
    const st = s.settings, ap = avgProfit(s), cap = Math.max(ap, st.profitFloor) * st.payCapX, maxRev = C.revenueBase(s) * st.practiceMaxX;
    const l = listed(s), r500 = l[l.length - 1].revenue, out = [], usedFirms = new Set();
    for (let k = 0; k < Math.min(5, st.practicesPerYear); k++) {

      let rev = Math.round(Math.exp(R.uniform(s, Math.log(st.practiceMin), Math.log(Math.max(st.practiceMin * 1.0001, hiEff)))) / 1000) * 1000;
      let d = null;

        const hi = Math.min(maxRev, cap * st.payTerm / st.top500Price, 1.6 * rev);
        const fs = l.filter(f => !usedFirms.has(f.id) && f.revenue >= 0.6 * rev && f.revenue <= hi);
        if (fs.length) { const f = pick(s, fs); usedFirms.add(f.id); const hq = C.GEO.cities.find(c => c[0] === f.hq || C.cityBase(c[0]) === C.cityBase(f.hq)) || [f.hq, 'NY']; d = { name: f.name, firmId: f.id, revenue: f.revenue, price: Math.round(f.revenue * st.top500Price / 1000) * 1000, main: hq, offices: dealOffices(s, f.revenue, hq, f.offices), top500: f.rank }; }

  };

  /* ---------- Completing a deal ---------- */
  C.completeDeal = function (s, d, down) {
    const st = s.settings, t = refTurn(s), t1 = t + 1, y = C.monthOf(s, t).y, rev = d.revenue;
    down = clamp(Math.round(down || 0), 0, d.price);
    s.pendingOut += down;
    // directors, admin, team people
    let dirs = rev >= st.acqDirAlways ? Math.max(1, Math.round(rev / st.revPerAcqDir) + rint(s, -1, 1)) : rev >= st.acqDirFrom ? (R.next(s) < 0.5 ? 1 : 0) : 0;
    dirs = Math.min(dirs, d.staff);
    const newOff = d.offices.cities.length;
    const admin = Math.min(d.staff - dirs, Math.max(newOff, Math.round(d.staff / 15)));
    const teamPeople = d.staff - dirs - admin;
    // service lines and clients
    const newLines = [];
    d.lines.forEach(sl => { const x = s.services.find(v => v.slot === sl); if (!x.offered) { x.offered = true; x.fromTurn = t1; x.clients = 0; newLines.push(x.name); } });
    Object.entries(d.mix).forEach(([sl, c]) => { const x = s.services.find(v => v.slot === +sl); if (x.offered) x.clients += Math.round(c * st.retention); });
    // offices: one per city; a city where you already have an office joins it
    const offIds = [];
    d.offices.cities.forEach(c => {
      const mine = s.offices.find(o => o.city === c[0]);
      if (mine) { offIds.push(mine.id); return; }
      s.meta.nextOffice = (s.meta.nextOffice || 0) + 1;
      const o = { id: s.meta.nextOffice, city: c[0], state: c[1], region: C.cityRegion(c[0], c[1]), opened: t1, how: 'Acquired: ' + d.name, desks: 10, owned: false };
      s.offices.push(o); offIds.push(o.id);
    });
    // staff by department, split by the deal's client hours
    const hrs = { CAS: 0, Tax: 0, Audit: 0 };
    Object.entries(d.mix).forEach(([sl, c]) => { const x = s.services.find(v => v.slot === +sl); const g = x.group === 'Advisory' ? 'Tax' : x.group; hrs[g] += c * x.hpc; });
    const tot = hrs.CAS + hrs.Tax + hrs.Audit || 1, by = {};
    ['CAS', 'Tax', 'Audit'].forEach(g => by[g] = Math.floor(teamPeople * hrs[g] / tot));
    const big = ['CAS', 'Tax', 'Audit'].sort((a, b) => hrs[b] - hrs[a])[0];
    by[big] += teamPeople - by.CAS - by.Tax - by.Audit;
    ['CAS', 'Tax', 'Audit'].forEach(g => { if (g !== big && hrs[g] > 0 && by[g] < 2 && by[big] > 3) { const m = 2 - by[g]; by[g] += m; by[big] -= m; } });
    const src = 'Acquired: ' + d.name, ppl = [];
    const add = (role, team, offId) => { const c = C.genCandidate(s, role, { acquired: true }); c.salary = C.marketPay(s, role, c.years); const p = C.hire(s, c, { startTurn: t1, source: src, team }); if (offId) p.office = offId; ppl.push(p); return p; };
    const PAT = [2, 1, 1, 1, 3, 2, 1];
    let teamNo = 0;
    ['CAS', 'Tax', 'Audit'].forEach(g => {
      let team = null;
      for (let k = 0; k < by[g]; k++) {
        if (k % 7 === 0) { const pl = C.teamPlan(s, t); team = pl.byD[g].newRoom > 0 || dirs > 0 ? s.meta.nextTeam++ : null; teamNo++; }
        const off = offIds.length ? offIds[(teamNo - 1) % offIds.length] : null;
        const p = add(C.roleFor(g, PAT[k % 7]), team, off);
        if (team != null) { p.team = team; if (off && s.teamOffice) s.teamOffice[team] = off; }
      }
    });
    const depts = ['CAS', 'Tax', 'Audit'].filter(g => by[g] > 0).sort((a, b) => by[b] - by[a]);
    for (let k = 0; k < dirs; k++) add(C.roleFor(depts[k % Math.max(1, depts.length)] || 'Tax', 4), null, offIds[k % Math.max(1, offIds.length)] || null);
    for (let k = 0; k < admin; k++) add('Admin Assistant', null, offIds[k % Math.max(1, offIds.length)] || null);
    // size new offices to their people
    s.offices.filter(o => o.how === 'Acquired: ' + d.name && o.opened === t1).forEach(o => { const n = C.roster(s, t1).filter(p => p.office === o.id).length; o.desks = Math.max(10, Math.ceil(n * 1.3 / 5) * 5); });
    if (C.placeOffices) C.placeOffices(s, t1);
    // payment plan, logs, status
    const fin = d.price - down;
    s.acqPlans.push({ firm: d.name, turn: t, price: d.price, monthly: fin > 0 ? fin / st.payTerm : 0, monthsLeft: fin > 0 ? st.payTerm : 0, down, extra: 0 });
    log(s, y, 'Your acquisition', s.meta.firmName, d.name, rev, C.revT12(s) + rev);

    const pr = (s.practices || []).find(x => x === d || (x.name === d.name && x.status === 'For sale')); if (pr) pr.status = 'Bought (turn ' + t + ')';
    const byD = {}; ppl.forEach(p => { const k = p.role; byD[k] = (byD[k] || 0) + 1; });

  };
  // Bought top 500 firms leave the list at the next January update
  function dropBought(s) { s.market.firms.forEach(f => { if (f.boughtByYou && f.active) { f.active = false; f.status = 'Bought by ' + s.meta.firmName + ' (' + f.boughtYear + ')'; } }); }

  /* ---------- Cards ---------- */
  function dealLines(s, d) {
    const col = C.dealColor(s, d), lines = d.lines.map(sl => s.services.find(x => x.slot === sl).short);
    return [
      { k: 'Revenue', v: fmt$(d.revenue) }, { k: 'Price', v: fmt$(d.price) }, { k: 'Monthly payment (84 mo, no down)', v: fmt$(d.price / s.settings.payTerm) },
      { k: 'Check', v: col === 'green' ? 'Green: payment fits your profit' : col === 'yellow' ? 'Yellow: fits only with the firm\'s own profit' : 'Red: payment is more than you earn' },
      { k: 'Main office', v: d.main[0] }, { k: 'Offices it brings', v: d.offices.cities.length ? d.offices.cities.map(c => C.cityBase(c[0])).join(', ') : 'None (single location under ' + short$(s.settings.officeFrom) + ')' },
      { k: 'Staff · directors', v: d.staff ? d.staff + ' · ' + d.directorsText : 'None (client list only)' }, { k: 'New service lines', v: lines.join(', ') || 'None' },
      'Clients: ' + Object.entries(d.mix).map(([sl, c]) => c + ' ' + s.services.find(x => x.slot === +sl).short).join(', ') + '. You keep ' + Math.round(s.settings.retention * 100) + '% after the deal.',
    ];
  }
  C.buyCard = function (s, d) {
    C.pushCardFront(s, { type: 'buyConfirm', kind: 'choice', title: 'Buy ' + d.name + '?', data: { deal: d, lines: dealLines(s, d), buttons: [{ value: 'yes', label: 'Buy', primary: true }, { value: 'no', label: 'Not now' }] } });
  };
  C.payDownCard = function (s, i) {
    const pl = s.acqPlans[i]; if (!pl || pl.monthsLeft <= 0) return;
    const owed = pl.monthly * pl.monthsLeft;
    C.pushCardFront(s, { type: 'payDown', kind: 'choice', title: 'Pay down ' + pl.firm, data: { i, lines: [{ k: 'Owed', v: fmt$(owed) }, { k: 'Monthly payment', v: fmt$(pl.monthly) + ' · ' + pl.monthsLeft + ' left' }, { k: 'Cash', v: fmt$(C.cash(s)) }, 'Extra payments end the plan sooner; the monthly payment stays the same.'], input: { label: 'Or pay this many dollars (whole payments only)', min: 0, max: Math.round(owed), value: Math.round(pl.monthly) }, buttons: [{ value: 'off', label: 'Pay it off', primary: true }, { value: 'year', label: 'One year ahead' }, { value: 'amt', label: 'Pay amount' }, { value: 'cancel', label: 'Cancel' }] } });
  };

  /* ---------- Module ---------- */
  C.register({
    id: 'market',
    init(s) {
      const st = s.settings;
      s.market.firms.forEach((f, i) => { f.trend = R.normal(s) * (i < 10 ? st.trendSd / 2 : st.trendSd); f.offices = Math.max(1, Math.round(C.officeFit(s, f.revenue))); f.status = 'Active'; });
      s.market.officialRank = '500+';
      if (s.meta.startY >= 2027 && !(s.meta.startY === 2027 && s.meta.startM === 1)) { C.mergeCBIZ(s, s.meta.startY); listed(s).forEach((f, i) => { f.rank = i + 1; }); }

      { id: 'marketUpdate', after: 'january', run(s, cur) { if (C.monthOf(s, cur.t).m === (s.settings.marketMonth || 8) && cur.t >= 2) { dropBought(s); C.marketUpdate(s, cur.t); if (C.afterMarketUpdate) C.afterMarketUpdate(s, cur.t); } } },

      summaryLines(s, row) { if (row.m !== (s.settings.marketMonth || 8) || row.t < 2) return []; const mk = s.market; return ['IPA 500 UPDATE: the ' + mk.listYear + ' list is out. Your official rank: ' + (mk.officialRank === '500+' ? '500+' : '#' + mk.officialRank) + (mk.youNews ? ' (' + mk.youNews + ')' : '') + '.']; },
    },
    cards: {
      buyConfirm(s, card, a) {
        if (!a || a.v !== 'yes') return; const d = card.data.deal;
        C.pushCardFront(s, { type: 'buyDown', kind: 'choice', title: 'Down payment', data: { deal: d, lines: [{ k: 'Price', v: fmt$(d.price) }, { k: 'Cash', v: fmt$(C.cash(s)) }, 'Pay any amount now (0 is fine). The rest is paid over ' + s.settings.payTerm + ' months. 100% down means no monthly payments.'], input: { label: 'Down payment ($)', min: 0, max: Math.min(d.price, Math.max(0, Math.floor(C.cash(s)))), value: 0 }, options: [10, 25, 50, 100].map(p => ({ value: 'p' + p, label: p + '% down', sub: fmt$(d.price * p / 100) + ' now, then ' + fmt$(d.price * (1 - p / 100) / s.settings.payTerm) + '/month', disabled: d.price * p / 100 > C.cash(s) })), buttons: [{ value: 'amt', label: 'Use amount', primary: true }, { value: 'cancel', label: 'Cancel' }] } });
      },
      buyDown(s, card, a) {
        if (!a || a.v === 'cancel') return; const d = card.data.deal;
        const down = a.v[0] === 'p' ? d.price * (+a.v.slice(1)) / 100 : Math.max(0, +a.n || 0);
        if (down > C.cash(s) + 0.5) { C.pushCardFront(s, { type: 'info', kind: 'choice', title: 'Not enough cash', data: { lines: ['That down payment is more than your cash (' + fmt$(C.cash(s)) + ').'] } }); return; }
        const r = C.completeDeal(s, d, down);
        C.pushCardFront(s, { type: 'info', kind: 'choice', title: 'Done! ' + d.name + ' is yours', data: { lines: [{ k: 'People joining next month', v: String(r.people) }, { k: 'Directors · admin', v: r.dirs + ' · ' + r.admin }, { k: 'Offices added', v: String(r.offices) }, { k: 'New service lines', v: r.newLines.join(', ') || 'None' }, { k: 'Down payment', v: fmt$(r.down) }, { k: 'Monthly payment', v: r.monthly ? fmt$(r.monthly) + ' for ' + s.settings.payTerm + ' months' : 'None (paid in full)' }, Object.entries(r.roles).map(([k, v]) => v + ' ' + k).join(', ')] } });
      },
      payDown(s, card, a) {
        if (!a || a.v === 'cancel') return; const pl = s.acqPlans[card.data.i]; if (!pl) return;
        let k = a.v === 'off' ? pl.monthsLeft : a.v === 'year' ? Math.min(12, pl.monthsLeft) : Math.min(pl.monthsLeft, Math.floor((+a.n || 0) / pl.monthly + 1e-9));
        const amt = k * pl.monthly;
        if (k <= 0) { C.pushCardFront(s, { type: 'info', kind: 'choice', title: 'Too small', data: { lines: ['Pay at least one monthly payment (' + fmt$(pl.monthly) + ').'] } }); return; }
        if (amt > C.cash(s) + 0.5) { C.pushCardFront(s, { type: 'info', kind: 'choice', title: 'Not enough cash', data: { lines: [fmt$(amt) + ' is more than your cash (' + fmt$(C.cash(s)) + ').'] } }); return; }
        pl.monthsLeft -= k; pl.extra += amt; s.pendingOut += amt;
        C.pushCardFront(s, { type: 'info', kind: 'choice', title: 'Paid ' + fmt$(amt), data: { lines: [pl.monthsLeft ? pl.monthsLeft + ' payments left.' : pl.firm + ' is paid off.'] } });
      },
    },
  });
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* ===== CPA Firm Simulator v2 — ACQUISITION OVERHAUL (phase 8) =====
   1 Region filter for firms you're offered   2 Firms for sale through the year (pop-up, Hold list)
   3 Private equity tags, Ascend and Current added, 17 PE mergers + CBIZ in Jan 2027
   4 PE spreads each update. The yearly IPA 500 update runs in August (Jaye, Nov 2, 2026).
   Decided: about 6 offers a year (50% a month, tiers evenly); PE buys 3× as often, targets up to
   120% of its size, grows 3 points faster; 2–4 firms gain PE backing each update. */
(function (G) {
  const C = G.CPA, R = C.rng;
  const fmt$ = (v) => '$' + Math.round(v).toLocaleString('en-US');
  const sh = (v) => v >= 1e9 ? '$' + (v / 1e9).toFixed(2) + 'B' : v >= 1e6 ? '$' + (v / 1e6).toFixed(2) + 'M' : '$' + Math.round(v / 1e3) + 'K';
  const refTurn = (s) => s.cur ? s.cur.t : C.nextTurn(s);
  const listed = (s) => C.listedFirms(s);

  C.SETTINGS.push(
    ['marketMonth', 'Month the IPA 500 updates (1–12)', 8, 'v2', 'Version 2 market', 'n'],
    ['offerChance', 'Chance a firm is offered for sale each month', 0.5, 'v2', 'Version 2 market', 'p'],
    ['holdMonths', 'Months a firm can stay on your Hold list', 12, 'v2', 'Version 2 market', 'n'],
    ['peBuyX', 'PE-backed firms buy this many times as often', 3, 'v2', 'Version 2 market', 'n'],
    ['pePeerMax', 'Largest target for a PE buyer (× its revenue)', 1.2, 'v2', 'Version 2 market', 'n'],
    ['peGrowth', 'Extra yearly growth for PE-backed firms', 0.03, 'v2', 'Version 2 market', 'p'],
    ['peNewMin', 'Firms gaining PE backing each update, min', 2, 'v2', 'Version 2 market', 'n'],
    ['peNewMax', 'Firms gaining PE backing each update, max', 4, 'v2', 'Version 2 market', 'n'],
  );

  /* ---------- Starting PE data (roadmap "PE-backed firms" tab, ranks in the game's 2026 list) ---------- */
  const PE = { 6: 'Hellman & Friedman, Valeas', 9: 'New Mountain Capital', 12: 'KKR', 14: 'TowerBrook', 15: 'Apax', 16: 'Blackstone', 18: 'Reverence', 19: 'Parthenon', 21: 'Further Global (minority)', 22: 'Charlesbank', 23: 'New Mountain Capital', 24: 'Centerbridge', 25: 'Bain Capital (minority)', 26: 'Investcorp, PSP', 27: 'Summit Partners', 36: 'Audax', 39: 'Lovell Minnick', 41: 'Flexpoint Ford', 43: 'General Atlantic (minority)', 44: 'Goldman Sachs Alternatives, Lightyear', 46: 'DFW Capital Partners', 47: 'F3 Partners, Genstar', 48: 'H.I.G. Capital', 56: 'Trinity Hunt', 59: 'Cobepa (minority)', 64: 'Broad Sky', 72: 'Outside capital', 89: 'Madison Dearborn', 90: 'Unity Partners', 108: 'Unity Partners', 217: 'Rallyday Partners' };
  // already bought by a PE-backed firm: target rank -> buyer rank, or 'Ascend' / 'Current'
  const BOUGHT = [[53, 6], [70, 16], [128, 'Ascend'], [130, 'Ascend'], [140, 'Ascend'], [145, 'Ascend'], [154, 'Current'], [155, 'Ascend'], [165, 'Current'], [191, 90], [204, 'Ascend'], [223, 26], [232, 'Ascend'], [292, 'Current'], [371, 39], [422, 'Current'], [467, 27]];
  const BACKERS = ['Alpine Investors', 'Thrive Holdings', 'Lightyear', 'Unity Partners', 'Trinity Hunt', 'Audax', 'Parthenon', 'H.I.G. Capital', 'Summit Partners', 'Apax', 'Blackstone', 'KKR', 'Genstar', 'Centerbridge', 'New Mountain Capital', 'Charlesbank', 'Broad Sky', 'DFW Capital Partners', 'Rallyday Partners', 'Cynosure', 'Seaside Equity', 'TPG'];
  const pick = (s, a) => a[Math.floor(R.next(s) * a.length)];

  function newFirm(s, rev, news) {
    const city = pick(s, C.GEO.cities);
    const f = { id: s.market.firms.length + 1, name: C.firmName(s), revenue: rev, hq: city[0], trend: R.normal(s) * s.settings.trendSd, offices: Math.max(1, Math.round(C.officeFit(s, rev))), active: true, status: 'Active', news: news || 'New to the list', rank: null, lastRank: null };

  }
  function rerankTo500(s, y) {
    const l = listed(s);
    l.forEach((f, i) => { if (i >= 500) { f.active = false; f.status = 'Off the list (' + y + ')'; } });
    while (listed(s).length < 500) { const lo = listed(s).at(-1).revenue; newFirm(s, lo * R.uniform(s, s.settings.newFirmMin, s.settings.newFirmMax)); }
    listed(s).forEach((f, i) => { f.rank = i + 1; });

  function setupPE(s) {

    Object.entries(PE).forEach(([r, b]) => { const f = byRank[+r - 1]; if (f) { f.pe = true; f.backer = b; } });
    // Ascend (#24) and Current (#28), revenue fitting between their neighbours (no published figures)
    const add = (name, lo, hi, backer, hq) => { const f = { id: s.market.firms.length + 1, name, revenue: R.uniform(s, lo, hi), hq, trend: R.normal(s) * s.settings.trendSd, offices: 0, active: true, status: 'Active', news: '', rank: null, lastRank: null, pe: true, backer }; f.offices = Math.max(1, Math.round(C.officeFit(s, f.revenue))); s.market.firms.push(f); return f; };
    const w = byRank[22].revenue, cri = byRank[23].revenue, pkf = byRank[25].revenue, uhy = byRank[26].revenue;
    add('Ascend', Math.max(cri * 1.005, 590e6), Math.min(w * 0.995, 630e6), 'Alpine Investors', 'Not listed');
    add('Current', Math.max(uhy * 1.005, 420e6), Math.min(pkf * 0.995, 450e6), 'Thrive Holdings', 'Not listed');
    s.market.peTargets = BOUGHT.map(([tr, br]) => [byRank[tr - 1] && byRank[tr - 1].id, typeof br === 'number' ? byRank[br - 1].id : br]);
    rerankTo500(s, 2026);
  }
  // Dec 2026 / Jan 2027: CBIZ into Grant Thornton and the 17 PE deals that already happened
  C.scriptedMergers2027 = function (s, y) {
    if (s.meta.flags.pe2027) return; s.meta.flags.pe2027 = true;
    const lines = [], byName = (n) => s.market.firms.find(f => f.name === n && f.active);
    const cb = C.mergeCBIZ(s, y); if (cb) lines.push('Grant Thornton completes its merger with CBIZ (' + sh(cb.target.revenue) + ').');
    (s.market.peTargets || []).forEach(([tid, b]) => {
      const tg = s.market.firms.find(f => f.id === tid && f.active), buyer = typeof b === 'string' ? byName(b) : s.market.firms.find(f => f.id === b && f.active);
      if (!tg || !buyer) return;
      buyer.revenue += tg.revenue; buyer.offices += tg.offices || 0; tg.active = false; tg.status = 'Merged into ' + buyer.name + ' (' + y + ')';
      buyer.news = (buyer.news ? buyer.news + '; ' : '') + 'Bought ' + tg.name;
      s.history.mergers.push({ y, type: 'PE roll-up', buyer: buyer.name, bought: tg.name, added: tg.revenue, after: buyer.revenue });
      lines.push(buyer.name + ' folds in ' + tg.name + ' (' + sh(tg.revenue) + ').');
    });

    if (lines.length) C.pushCard(s, { type: 'info', kind: 'choice', title: 'Private equity news', data: { lines: ['Deals that closed around the new year:', ...lines.slice(0, 18), 'Everyone below moved up, and new firms joined at the bottom of the list.'] } });
  };
  // After each August update: PE spreads, and the PE headlines
  C.afterMarketUpdate = function (s, t) {
    const st = s.settings, y = C.monthOf(s, t).y, news = s.meta.peNews || [];
    const n = st.peNewMin + Math.floor(R.next(s) * (st.peNewMax - st.peNewMin + 1));
    const pool = listed(s).filter(f => !f.pe && f.rank > 10);
    for (let k = 0; k < n && pool.length; k++) {
      const f = pool.splice(Math.floor(R.next(s) * pool.length), 1)[0];
      f.pe = true; f.backer = pick(s, BACKERS); f.peSince = y;
      f.news = (f.news ? f.news + '; ' : '') + 'Takes private equity from ' + f.backer;
      news.push(f.name + ' (#' + f.rank + ') takes private equity from ' + f.backer + '.');
    }
    s.meta.peNews = [];
    if (news.length) C.pushCard(s, { type: 'info', kind: 'choice', title: 'Private equity news', data: { lines: news.slice(0, 10) } });
  };

  /* ---------- Region filter ---------- */
  C.acqRegionOk = (s, city, st) => { const r = s.acqRegions || []; return !r.length || r.includes(C.cityRegion(city, st)); };
  C.acqRegionCard = function (s) {
    const home = s.offices.length ? s.offices.map(o => o.region) : ['Eastern Idaho'];
    const order = [...new Set(home.concat(['Northern Utah', 'Wasatch Front'], C.allRegions().map(r => r.region)))];
    C.pushCardFront(s, { type: 'acqRegions', kind: 'choice', title: 'Where will you buy firms?', data: { lines: ['Only firms whose main office is in these regions are offered to you. Pick none to see firms anywhere.'], options: order.map(r => ({ value: r, label: r, checked: (s.acqRegions || []).includes(r) })), multi: { max: 40 }, buttons: [{ value: 'ok', label: 'Save', primary: true }, { value: 'cancel', label: 'Cancel' }] } });
  };

  /* ---------- Firms for sale through the year ---------- */
  function makeOffer(s) {
    const want = pick(s, ['green', 'yellow', 'red']), save = s.practices;

      best = ok.find(d => C.dealColor(s, d) === want) || (k >= 3 ? ok[0] : null);
    }
    s.practices = save;
    return best;
  }
  function offerCard(s, d, fromHold) {
    const col = C.dealColor(s, d), lines = d.lines.map(sl => s.services.find(x => x.slot === sl).short), st = s.settings;
    C.pushCard(s, { type: 'forSale', kind: 'choice', title: (fromHold ? 'On hold: ' : 'For sale: ') + d.name, data: { deal: d, lines: [
      { k: 'Revenue', v: fmt$(d.revenue) }, { k: 'Asking price', v: fmt$(d.price) }, { k: 'Monthly payment (no down)', v: fmt$(d.price / st.payTerm) },
      { k: 'Fits your budget?', v: col === 'green' ? 'Green: can afford' : col === 'yellow' ? 'Yellow: a stretch' : 'Red: can\'t afford yet' },
      { k: 'Main office', v: d.main[0] + ' · ' + C.cityRegion(d.main[0], d.main[1]) }, { k: 'Staff', v: d.staff ? String(d.staff) : 'None (the owner sells the client list)' }, { k: 'Brings', v: lines.join(', ') || 'No new service lines' },
      d.top500 ? 'A top 500 firm (#' + d.top500 + ').' : 'Most offers are now or never. Hold keeps it on your watch list for up to ' + st.holdMonths + ' months while you negotiate or save up.'],
      buttons: [{ value: 'buy', label: 'Buy…', primary: true }, ...(fromHold ? [] : [{ value: 'hold', label: 'Hold' }]), { value: 'pass', label: 'Pass' }] } });
  }
  function monthlyOffer(s, t) {
    const st = s.settings;
    // drop expired holds
    const before = (s.watch || []).length;
    s.watch = (s.watch || []).filter(w => w.until >= t);
    if (s.watch.length < before) (s.meta.peNews = s.meta.peNews || []);

  }

    init(s) {

      { id: 'forSale', after: 'pe2027', run(s, cur) { if (cur.t >= 1) monthlyOffer(s, cur.t); } },

    cards: {
      forSale(s, card, a) {
        const d = card.data.deal; if (!a) return;
        if (a.v === 'buy') { s.watch = (s.watch || []).filter(w => w.deal.name !== d.name); C.buyCard(s, d); }

      },
      acqRegions(s, card, a) { if (a && a.v === 'ok') s.acqRegions = (a.picked || []).slice(); },
    },
    hooks: {
      summaryLines(s, row) {
        const exp = (s.watch || []).filter(w => w.until === row.t);
        return exp.length ? ['Leaving your Hold list after this month: ' + exp.map(w => w.deal.name).join(', ') + '.'] : [];
      },
    },
  });

<script>/* ===== CPA Firm Simulator v2 — TECHNOLOGY AND CPE (phase 9) =====
   1 Software tiers (Basic, Cloud, AI-assisted): a cost per person a month on top of the base software
     cost, more client output per person, and a learning curve after an upgrade.
   2 CPE: licensed staff (CPA, EA, CPB) spend yearly CPE hours (less billable time) and a training cost.
     Skipping CPE saves both, but at year end each licensed person may lose their licenses.
   All numbers are starting estimates in Settings (Technology and CPE) for balancing. */
(function (G) {
  const C = G.CPA, R = C.rng;
  const fmt$ = (v) => '$' + Math.round(v).toLocaleString('en-US');
  C.SETTINGS.push(
    ['techCost1', 'Cloud tier: extra software cost per person / month', 250, 'v2', 'Technology and CPE', '$'],
    ['techCost2', 'AI-assisted tier: extra software cost per person / month', 600, 'v2', 'Technology and CPE', '$'],
    ['techBoost1', 'Cloud tier: extra client output per person', 0.08, 'v2', 'Technology and CPE', 'p'],
    ['techBoost2', 'AI-assisted tier: extra client output per person', 0.15, 'v2', 'Technology and CPE', 'p'],
    ['techLearnLoss', 'Output lost the first month after an upgrade (per tier)', 0.15, 'v2', 'Technology and CPE', 'p'],
    ['techLearnMonths', 'Months until the learning curve is over', 4, 'v2', 'Technology and CPE', 'n'],
    ['cpeCPA', 'CPE hours a year: CPA', 40, 'v2', 'Technology and CPE', 'n'],
    ['cpeEA', 'CPE hours a year: EA', 24, 'v2', 'Technology and CPE', 'n'],
    ['cpeCPB', 'CPE hours a year: CPB', 20, 'v2', 'Technology and CPE', 'n'],
    ['cpeCostHr', 'CPE training cost per hour', 30, 'v2', 'Technology and CPE', '$'],
    ['cpeRisk', 'Chance a licensed person loses their licenses after a full year without CPE', 0.5, 'v2', 'Technology and CPE', 'p'],
    ['overdraftRate', 'Yearly interest on negative cash (line of credit)', 0.10, 'v2', 'Game', 'p'],
  );
  C.TECH = [
    { name: 'Basic', text: 'Desktop software and spreadsheets. Included in the base software cost.' },
    { name: 'Cloud', text: 'Cloud accounting, portals and e-signatures. Everyone can handle more clients.' },
    { name: 'AI-assisted', text: 'AI bookkeeping, review and drafting on top of cloud tools. The biggest boost, at the highest cost.' },
  ];
  C.LICENSES = ['CPA', 'EA', 'CPB'];
  const tech = (s) => (s.tech = s.tech || { tier: 0, since: null, loss: 0 });
  const nowT = (s) => s.cur ? s.cur.t : C.nextTurn(s);
  C.techBoost = (s, tier) => tier === 2 ? s.settings.techBoost2 : tier === 1 ? s.settings.techBoost1 : 0;
  C.techCost = (s, tier) => tier === 2 ? s.settings.techCost2 : tier === 1 ? s.settings.techCost1 : 0;
  // Learning curve: the loss is full in the first month after the switch and fades to 0 over techLearnMonths
  C.techLearning = function (s, t) {
    const tc = tech(s); if (!tc.loss || tc.since == null) return 0;
    const n = Math.max(1, s.settings.techLearnMonths), k = (t == null ? nowT(s) : t) - tc.since;
    return k < 0 ? 0 : tc.loss * Math.max(0, 1 - k / n);
  };
  C.techFactor = function (s, t) { const tc = tech(s); return (1 + C.techBoost(s, tc.tier)) * (1 - C.techLearning(s, t)); };
  C.setTech = function (s, tier) {
    const tc = tech(s); tier = Math.max(0, Math.min(2, Math.round(tier)));
    if (tier === tc.tier) return false;
    const up = tier - tc.tier;
    tc.loss = up > 0 ? Math.min(0.6, up * s.settings.techLearnLoss) : 0; // going down has no learning curve
    tc.tier = tier; tc.since = C.nextTurn(s);
    return true;
  };
  // CPE
  C.cpeOn = (s) => s.decisions.cpe !== false;
  C.cpeYearHours = (s, p) => { const c = p.certs || [], st = s.settings; return Math.max(c.includes('CPA') ? st.cpeCPA : 0, c.includes('EA') ? st.cpeEA : 0, c.includes('CPB') ? st.cpeCPB : 0); };
  C.cpeMonthHours = (s, p) => C.cpeOn(s) || p.id === 1 ? C.cpeYearHours(s, p) / 12 : 0; // you always keep your own CPE current
  C.licensed = (s, t) => C.activePeople(s, t).filter(p => C.cpeYearHours(s, p) > 0);
  C.cpeMonthCost = (s, t) => C.licensed(s, t).filter(p => C.cpeOn(s) || p.id === 1).reduce((a, p) => a + C.cpeYearHours(s, p) * s.settings.cpeCostHr / 12 * (p.hc || 1), 0);
  C.overdraftInterest = (s) => { const L = s.history.log, cash = (L.length ? L[L.length - 1].cash : s.settings.startingCash) - (s.pendingOut || 0); return cash < 0 ? -cash * (+s.settings.overdraftRate || 0) / 12 : 0; };
  C.techMonthCost = (s, t) => C.activePeople(s, t).reduce((a, p) => a + (p.hc || 1), 0) * C.techCost(s, tech(s).tier);

  C.techCard = function (s, tier) {
    const tc = tech(s), st = s.settings, t = C.nextTurn(s), heads = C.activePeople(s, t).reduce((a, p) => a + (p.hc || 1), 0), up = tier > tc.tier;
    C.pushCardFront(s, { type: 'techSwitch', kind: 'choice', title: 'Switch to ' + C.TECH[tier].name + '?', data: { tier, lines: [C.TECH[tier].text,
      { k: 'Extra software cost', v: fmt$(C.techCost(s, tier)) + ' per person a month (' + fmt$(C.techCost(s, tier) * heads) + ' now)' },
      { k: 'Client output per person', v: '+' + Math.round(C.techBoost(s, tier) * 100) + '% (now +' + Math.round(C.techBoost(s, tc.tier) * 100) + '%)' },
      up ? 'Learning curve: everyone does ' + Math.round(Math.min(0.6, (tier - tc.tier) * st.techLearnLoss) * 100) + '% less in the first month, easing off over ' + st.techLearnMonths + ' months.' : 'Going down a tier has no learning curve, but the extra output goes away.'],
      buttons: [{ value: 'yes', label: 'Switch from ' + C.monthLabel(s, t), primary: true }, { value: 'no', label: 'Cancel' }] } });
  };
  Object.assign(C.cardHandlers, { techSwitch(s, card, a) { if (a && a.v === 'yes') C.setTech(s, card.data.tier); } });
  C.register({
    id: 'tech',
    init(s) { s.tech = { tier: 0, since: null, loss: 0 }; s.decisions.cpe = true; s.meta.cpeSkip = 0; },
    migrate(s) { tech(s); if (s.decisions.cpe == null) s.decisions.cpe = true; s.meta.cpeSkip = s.meta.cpeSkip || 0; },
    stages: [
      { id: 'cpeTrack', after: 'compute', run(s) { if (!C.cpeOn(s)) s.meta.cpeSkip = (s.meta.cpeSkip || 0) + 1; } },
    ],
    hooks: {
      extraCost(s, t) { return C.techMonthCost(s, t) + C.cpeMonthCost(s, t) + C.overdraftInterest(s); },
      yearEnd(s, y) {
        const out = [], skip = Math.min(12, s.meta.cpeSkip || 0); s.meta.cpeSkip = 0;
        const t = C.turnOf(s, y, 12), tc = tech(s);
        if (tc.tier) out.push('Software: ' + C.TECH[tc.tier].name + ' tier.');
        if (!skip) return out;
        const lost = [];
        C.licensed(s, t).filter(p => p.id !== 1).forEach(p => {
          if (R.next(s) < s.settings.cpeRisk * skip / 12) { const had = p.certs.filter(c => C.LICENSES.includes(c)); p.certs = p.certs.filter(c => !C.LICENSES.includes(c)); p.source += '; lost ' + had.join('/') + ' (no CPE, ' + y + ')'; lost.push(p.name + ' (' + had.join(', ') + ')'); }
        });
        out.push('CPE was skipped for ' + skip + ' month' + (skip > 1 ? 's' : '') + ' this year. ' + (lost.length ? 'Licenses lapsed: ' + lost.slice(0, 10).join(', ') + (lost.length > 10 ? ' and ' + (lost.length - 10) + ' more' : '') + '. They can earn them back in later years.' : 'Every license survived this time.'));
        return out;
      },
    },
  });
})(typeof window !== 'undefined' ? window : globalThis);
</script>

      <p class="muted small">Licensed people spend ${st.cpeCPA} (CPA), ${st.cpeEA} (EA) or ${st.cpeCPB} (CPB) hours a year on CPE instead of client work, at ${$$(st.cpeCostHr)} an hour. Skipping saves both, but at year end each licensed person can lose their licenses (${Math.round(st.cpeRisk * 100)}% chance after a full year without CPE). You always keep your own CPE current.${S.meta.cpeSkip ? ' Skipped so far this year: ' + S.meta.cpeSkip + ' month' + (S.meta.cpeSkip > 1 ? 's' : '') + '.' : ''}</p>

<script>/* ===== Acquisitions + Rankings panels (phase 4) — on the Growth tab ===== */
(function () {
  const C = window.CPA, UI = window.CPA_UI;
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const $$ = (v) => (v < 0 ? '−$' : '$') + Math.abs(Math.round(v || 0)).toLocaleString('en-US');
  const sh = (v) => v >= 1e9 ? '$' + (v / 1e9).toFixed(2) + 'B' : v >= 1e6 ? '$' + (v / 1e6).toFixed(2) + 'M' : '$' + Math.round(v / 1e3) + 'K';
  let showAll = false, q = '';
  UI.acqPanel = function () {
    const S = UI.state(), busy = C.busy(S), st = S.settings, r12 = C.revT12(S), y = C.monthOf(S, C.nextTurn(S)).y;
    const watch = (S.watch || []).map((w, i) => {
      const d = w.deal, col = C.dealColor(S, d), left = w.until - C.nextTurn(S) + 1;
      const lines = d.lines.map(sl => S.services.find(x => x.slot === sl).short);
      return `<li class="deal ${col}"><div class="off-h"><div><b>${esc(d.name)}</b><span>${d.top500 ? 'Top 500 firm · ' : ''}${esc(d.main[0])} · ${esc(C.cityRegion(d.main[0], d.main[1]))}${lines.length ? ' · brings ' + esc(lines.join(', ')) : ''}</span></div><span class="pill ${col === 'green' ? 'on' : col === 'yellow' ? 'soon' : 'bad'}">${left} mo left</span></div>
        <div class="facts"><span>Revenue <b class="num">${sh(d.revenue)}</b></span><span>Price <b class="num">${sh(d.price)}</b></span><span><b class="num">${$$(d.price / st.payTerm)}</b>/mo</span><span>${d.staff ? `<b class="num">${d.staff}</b> staff` : 'No staff'}</span></div>
        <div class="chips"><button class="chip act" data-wbuy="${i}"${busy ? ' disabled' : ''}>Buy…</button><button class="chip" data-wdrop="${i}"${busy ? ' disabled' : ''}>Drop</button></div></li>`;
    }).join('');
    const boughtThisYear = new Set(S.market.firms.filter(f => f.boughtByYou && f.boughtYear === y).map(f => f.id));
    const inRegion = (f) => { if (!(S.acqRegions || []).length) return true; const c = C.GEO.cities.find(x => x[0] === f.hq || C.cityBase(x[0]) === C.cityBase(f.hq)); return !!c && C.acqRegionOk(S, c[0], c[1]); };
    const below = C.listedFirms(S).filter(f => f.revenue < r12 && !f.boughtByYou && inRegion(f)).slice(0, 8);
    const plans = S.acqPlans.map((p, i) => `<tr><th>${esc(p.firm)}</th><td>${$$(p.price)}</td><td>${$$(p.down)}</td><td>${$$(p.monthly)}</td><td>${p.monthsLeft}</td><td>${$$(p.monthly * p.monthsLeft)}</td><td>${p.monthsLeft > 0 ? `<button class="chip act" data-paydown="${i}"${busy ? ' disabled' : ''}>Pay down</button>` : 'Paid'}</td></tr>`).join('');
    const ap = S.history.log.slice(-12); const avg = ap.length ? ap.reduce((a, r) => a + r.profit, 0) / ap.length : 0;
    const regs = S.acqRegions || [];
    return `<section class="panel"><div class="soon-h"><h2>Acquisitions</h2><span class="pill on">${(S.watch || []).length} on hold</span></div>
      <p class="muted small">Firms come up for sale through the year (about ${Math.round(st.offerChance * 12)} a year) as pop-ups: buy, pass, or Hold one for up to ${st.holdMonths} months. Green: the payment fits your average monthly profit (${$$(avg)}). Yellow: it fits only with the bought firm's own profit. Red: you can't afford it yet. Payments run ${st.payTerm} months; you keep ${Math.round(st.retention * 100)}% of its clients.</p>
      <div class="kv"><span>Buying in</span><b>${regs.length ? esc(regs.join(', ')) : 'Anywhere'}</b></div>
      <div class="chips"><button class="chip act" data-acqreg="1"${busy ? ' disabled' : ''}>Change regions</button></div>
      ${watch ? `<h3>Hold list</h3><ul class="offs">${watch}</ul>` : '<p class="muted">No firms on hold.</p>'}</section>
    <section class="panel"><h2>Buy a top 500 firm</h2>
      ${below.length ? `<p class="muted small">Any firm smaller than your ${sh(r12)} yearly revenue, at ${st.top500Price}× revenue.</p><ul class="offs">${below.map(f => `<li class="deal"><div class="off-h"><div><b>#${f.rank} ${esc(f.name)}</b><span>${esc(f.hq)} · ${f.offices} offices</span></div><button class="chip act" data-buy500="${f.id}"${busy ? ' disabled' : ''}>Buy for ${sh(f.revenue * st.top500Price)}</button></div></li>`).join('')}</ul>` : `<p class="muted">The smallest top 500 firm earns ${sh(C.listedFirms(S).at(-1).revenue)} a year. Once your yearly revenue passes a listed firm's, you can buy it here.</p>`}</section>
    ${plans ? `<section class="panel"><h2>Payment plans</h2><div class="tablewrap"><table class="log"><thead><tr><th>Firm</th><th>Price</th><th>Down</th><th>Monthly</th><th>Left</th><th>Owed</th><th></th></tr></thead><tbody>${plans}</tbody></table></div></section>` : ''}`;
  };
  UI.rankPanel = function () {
    const S = UI.state(), mk = S.market, l = C.listedFirms(S), r12 = C.revT12(S), live = C.liveRank(S);
    const rows = [];
    let youPlaced = false;
    const youRow = `<tr class="you"><th>${live === '500+' ? '500+' : live}</th><td class="nm">${esc(S.meta.firmName)} (you)</td><td>${sh(r12)}</td><td></td><td>Live, last 12 months</td></tr>`;

    });
    if (!youPlaced && !q) rows.push(youRow);
    const mlog = S.history.mergers.slice(-15).reverse().map(m => `<li><b>${m.y}</b> ${esc(m.buyer)} bought ${esc(m.bought)} <span class="muted">(${m.type}, ${sh(m.added)})</span></li>`).join('');

      <p class="muted small">Official rank uses last calendar year's revenue and updates each August, when the new list comes out. Live rank uses the last 12 months. You join the list when a year's revenue beats #500 (${sh(l.at(-1).revenue)}).</p>
      <div class="chips"><input id="rq" type="text" placeholder="Find a firm" value="${esc(q)}" aria-label="Find a firm" style="flex:1;min-width:0"><button class="chip${showAll ? ' on' : ''}" data-rall="1">${showAll ? 'Show fewer' : 'Show all 500'}</button></div>
      <div class="tablewrap"><table class="log rk"><thead><tr><th>#</th><th>Firm</th><th>Revenue</th><th>Change</th><th>News</th></tr></thead><tbody>${rows.join('')}</tbody></table></div></section>
      ${mlog ? `<section class="panel"><h2>Mergers log</h2><ul class="mlog">${mlog}</ul></section>` : ''}`;
  };
  UI.bindMarket = (refresh) => {
    const S = UI.state();
    document.querySelectorAll('[data-wbuy]').forEach(b => b.onclick = () => { if (C.busy(S)) return; C.buyCard(S, S.watch[+b.dataset.wbuy].deal); refresh(); });
    document.querySelectorAll('[data-wdrop]').forEach(b => b.onclick = () => { if (C.busy(S)) return; S.watch.splice(+b.dataset.wdrop, 1); refresh(); });
    document.querySelectorAll('[data-acqreg]').forEach(b => b.onclick = () => { if (C.busy(S)) return; C.acqRegionCard(S); refresh(); });
    document.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => { if (C.busy(S)) return; C.buyCard(S, S.practices[+b.dataset.buy]); refresh(); });
    document.querySelectorAll('[data-buy500]').forEach(b => b.onclick = () => { if (C.busy(S)) return; const f = S.market.firms.find(x => x.id === +b.dataset.buy500); C.buyCard(S, C.top500Deal(S, f)); refresh(); });
    document.querySelectorAll('[data-paydown]').forEach(b => b.onclick = () => { if (C.busy(S)) return; C.payDownCard(S, +b.dataset.paydown); refresh(); });
    document.querySelectorAll('[data-rall]').forEach(b => b.onclick = () => { showAll = !showAll; refresh(); });
    const rq = document.getElementById('rq'); if (rq) rq.onchange = () => { q = rq.value.trim(); refresh(); };
  };
})();
</script>

    if (k == null || k >= STEPS.length) { box.hidden = true; shown = null; return; }
    const st = STEPS[k];
    if (st.wait === 'month' && S.meta.tutorialPlayed == null) S.meta.tutorialPlayed = C.played(S);
    const waiting = st.wait === 'month' && C.played(S) <= S.meta.tutorialPlayed;
    if (st.wait === 'month' && !waiting && !S.queue.length && !C.busy(S)) { S.meta.tutorial = k + 1; UI.save(); return UI.setTab(STEPS[k + 1].tab); }
    if (UI.tab() !== st.tab) return UI.setTab(st.tab);
    if (S.queue.length) { box.hidden = true; return; } // a pop-up is open; the tutorial waits behind it
    const target = st.at.split(',').map(q => document.querySelector(q.trim())).find(Boolean);
    if (target) target.classList.add('tut-hi');
    box.innerHTML = `<div class="tut-top"><h3>${st.title}</h3><span>Tutorial ${k + 1} of ${STEPS.length}</span></div><p>${st.text}</p>${waiting ? '<p class="tut-wait">Waiting for you to tap Play next month…</p>' : ''}
      <div class="tut-b">${k ? '<button class="btn" data-tut="back">Back</button>' : ''}<button class="btn primary" data-tut="next"${waiting ? ' disabled' : ''}>${k === STEPS.length - 1 ? 'Finish' : 'Next'}</button><button class="btn" data-tut="skip">Skip tutorial</button></div>`;
    box.hidden = false;
    box.querySelectorAll('[data-tut]').forEach(b => b.onclick = () => {
      const a = b.dataset.tut;
      if (a === 'skip' || (a === 'next' && k === STEPS.length - 1)) return end(S);
      S.meta.tutorial = Math.max(0, k + (a === 'next' ? 1 : -1)); if (STEPS[S.meta.tutorial].wait) S.meta.tutorialPlayed = null;
      UI.save(); UI.setTab(STEPS[S.meta.tutorial].tab);
    });
    if (shown !== k && target) { shown = k; const r = target.getBoundingClientRect(); if (r.top < 70 || r.bottom > innerHeight - box.offsetHeight - 80) window.scrollTo({ top: Math.max(0, scrollY + r.top - 90), behavior: 'auto' }); }
  };
  // The question asked at every New Game
  UI.askTutorial = function (onTutorial, onSkip) {
    const box = document.getElementById('tutask'); if (!box) return onSkip();
    box.innerHTML = `<div class="scrim"></div><div class="card" role="dialog" aria-modal="true" aria-labelledby="tutask-t"><div class="card-h"><span class="lbl">New game</span><h2 id="tutask-t">Take the guided tutorial?</h2></div>
      <div class="card-b"><p>The tutorial starts you with a preset firm (BlueJaye Financials LLC, $500 a month of marketing) and walks you through the game: how to play a month, where to hire, how to open offices, buy firms and read the IPA 500. It takes about two minutes.</p><p class="muted small">Skip starts your game with the name and seed you chose.</p></div>
      <div class="card-f"><button class="btn primary" data-ta="yes">Start the tutorial</button><button class="btn" data-ta="no">Skip</button></div></div>`;
    box.hidden = false; document.body.classList.add('locked');
    const done = (f) => { box.hidden = true; box.innerHTML = ''; document.body.classList.remove('locked'); f(); };
    box.querySelector('[data-ta=yes]').onclick = () => done(onTutorial);
    box.querySelector('[data-ta=no]').onclick = () => done(onSkip);
    box.querySelector('[data-ta=yes]').focus({ preventScroll: true });
  };
})();
</script>
